################################################################################
# Helios Desktop Application - electron-builder Configuration
#
# This file configures cross-platform packaging for:
# - Windows (NSIS assisted installer)
# - macOS (DMG + PKG installers)
# - Linux (AppImage + DEB packages)
#
# Build outputs are created in dist/
# Do not use absolute paths for build resources - all paths are relative to repo root
#
# For CI/CD: This configuration is platform-agnostic and works in any environment
################################################################################

appId: com.navyug.helios
productName: Helios
copyright: Copyright © 2024-2026 Navyug Designs

directories:
  buildResources: build
  output: dist

files:
- out/**
- package.json

extraResources:
- from: resources/backend/${os}
  to: backend
- from: resources/Helios_splash.png
  to: Helios_splash.png
- from: build/icons/512x512.png
  to: icon.png

################################################################################
# WINDOWS - x64 only (Windows 10 + 11 dono par chalta hai)
################################################################################
win:
  target:
  - nsis
  icon: build/icon.ico
  signAndEditExecutable: false
  publisherName: "Navyug Designs"

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Helios
  uninstallDisplayName: Helios
  oneClick: false
  license: build/license.txt
  allowToChangeInstallationDirectory: true
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  ################################################################################
  # macOS - Professional App Bundle + Installers
  ################################################################################
  # Targets:
  # - DMG: Simple drag-and-drop installer (Helios.dmg)
  # - PKG: Professional installer with license (Helios.pkg)
  # App bundle: /Applications/Helios.app
  #
mac:
  # Code signing + notarization.
  #
  # `identity` is intentionally NOT set: electron-builder then picks the
  # "Developer ID Application" identity out of the keychain on its own (in CI
  # that is the temporary build.keychain created by the workflow). Setting
  # `identity: null` / `sign: null` DISABLES signing entirely - that is what
  # this project did before notarization was configured, and restoring either
  # of those lines will silently ship an unsigned, un-notarizable app.
  #
  # `notarize: false` is also deliberate and is NOT the same as "do not
  # notarize": it turns off electron-builder's own built-in notarization so it
  # does not run twice. Notarization is driven by our hooks instead -
  # scripts/notarize.cjs for the .app and scripts/notarize-pkg.cjs for the
  # .pkg - because the built-in path cannot reach the .pkg installer.
  notarize: false
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  minimumSystemVersion: "12.0"
  target:
  #- dmg
  - pkg

# dmg:
#   artifactName: ${name}-${version}-setup.${ext}

pkg:
  # The .pkg is signed by productbuild with a "Developer ID Installer"
  # certificate - a DIFFERENT cert from the "Developer ID Application" one that
  # signs the .app. electron-builder finds it in the keychain automatically, so
  # no `identity` key is needed here; it is only listed in the CI workflow as
  # the APPLE_INSTALLER_IDENTITY secret for the verification step.
  artifactName: ${name}-${version}-setup.${ext}
  license: build/license.txt
  installLocation: /Applications
  allowAnywhere: true
  allowCurrentUserHome: false
  isRelocatable: false
  isVersionChecked: true
  welcome: build/welcome.txt
  conclusion: build/conclusion.txt

################################################################################
# LINUX - AppImage + DEB Packages
################################################################################
linux:
  target:
  - AppImage
  - deb
  maintainer: Navyug Designs
  category: Utility
  executableName: helios
  artifactName: ${name}-${version}-setup.${ext}
  icon: build/icons

afterPack: build/afterPack.js
# Notarization hooks. Two are needed because they run at different times:
#   afterSign             -> the .app bundle (fires during app packaging)
#   afterAllArtifactBuild -> the .pkg installer (fires once targets are built)
# Both no-op without APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID, or with
# SKIP_NOTARIZATION=1 - so local unsigned builds still work.
afterSign: scripts/notarize.cjs
afterAllArtifactBuild: scripts/notarize-pkg.cjs

npmRebuild: false

publish:
  provider: generic
  url: https://updates.example.com/auto-updates
