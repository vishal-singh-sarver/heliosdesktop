site_name: Helios Desktop
site_description: Technical documentation for the Helios desktop application
# TODO: set once the publish target is decided (GitLab Pages vs GitHub Pages mirror).
# site_url: https://example.org/helios-desktop/

# TODO: point at the repo once there is a web-facing remote. The current origin is
# an internal host (git@192.168.3.185), which would not resolve for readers.
# repo_url: https://.../helios/heliosdesktop
# edit_uri: -/edit/develop/docs/

docs_dir: docs

# Kept in docs/ for proximity to what they produce, but they are tooling and
# source files — not pages. Without this they are copied verbatim into the built
# site (and would be published with it).
exclude_docs: |
  gen/
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  # Renders :material-xxx: / :fontawesome-xxx: icon shortcodes as inline SVG.
  # Without it they render as literal text — the home page's card icons and the
  # generated endpoint table's dormant markers both depend on this.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

