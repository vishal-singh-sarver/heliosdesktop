# ============================================================================
# CI / main
#
# Structurally identical to ci-release.yml but for the main branch.
# Produces production-ready artifacts that will be PROMOTED to the stable
# feed (not directly published).
#
# Flow:
#   develop -> release -> main  ... then tag v1.2.3 -> publish-stable.yml
#
# Doc reference: section 5.4
# ============================================================================
name: CI / main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Manual trigger - emergency cases
  workflow_dispatch:

# ── Work around npm's peer-resolution crash ─────────────────────────────────
# Every job died in `npm install` with
#   npm error Cannot read properties of null (reading 'edgesOut')
# The debug log's `verbose stack` pins it: arborist #loadPeerSet crashes while
# resolving the peer set of node_modules/vitest (last manifests fetched:
# @vitest/coverage-istanbul@4.1.11, @vitest/coverage-v8@4.1.11, jsdom, canvas).
# That is an npm 10 bug: a peer-dependency conflict crashes the tree builder
# instead of reporting ERESOLVE. legacy-peer-deps skips peer-set resolution, so
# the crash path is never reached. Set as an env var so it covers EVERY npm
# call in every job and container (including the Rollup WASM `npm install`).
# Proper fix: put vitest and every @vitest/* package on the same exact version
# in package.json; after that this line can be removed.
env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

# ── About the "Install dependencies" step used in every job ─────────────────
# Replaces a bare `npm install`, which died on all 5 jobs with:
#   npm error Cannot read properties of null (reading 'edgesOut')
# That is a crash inside npm's tree builder (arborist). Cause found: peer
# resolution for vitest - see the workflow-level `env:` above. Earlier notes:
#   - It is not the lockfile: with package-lock.json AND node_modules deleted,
#     the install crashed the same way ~100ms after starting, before any
#     download - so it comes from package.json / repo contents / .npmrc.
#   - A missing file:/link: folder or workspace does not reproduce it on
#     npm 10.9 / Node 22 (tested), so that is not the explanation either.
# The step:
#   1. deletes any node_modules that came in with the checkout,
#   2. installs, and on failure prints the tail of THIS install's debug log,
#      whose `verbose stack` lines show where npm crashed.
#      (The log path is taken from npm's own output. Picking the newest file in
#      _logs is wrong: any later npm command, even `npm config get`, writes a
#      newer log and hides the crash - which is what an earlier version did.)
# No lockfile-less retry: it did not help, and a build without the lockfile
# would pull unpinned dependency versions.
# The step is repeated verbatim in each job; keep the copies in sync.

jobs:
  # lint and test-unit run on EVERY event that reaches this workflow - no `if:`.
  # They previously ran on PRs only when the head branch was `release` or
  # `hotfix/*`. Because a skipped job reports as successful, a PR into main from
  # any other branch name showed an all-green check run with nothing having
  # actually executed - the same "a check that cannot go red" failure mode the
  # continue-on-error comment below warns about. These two jobs are cheap
  # (ubuntu-only, no build), so gating them by branch name bought nothing.
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          echo "node $(node -v), npm $(npm -v)"
          rm -rf node_modules
          out="${RUNNER_TEMP:-/tmp}/npm-install-output.txt"
          if npm install --no-audit --no-fund 2>&1 | tee "$out"; then exit 0; fi
          log=$(grep -o 'A complete log of this run can be found in: .*' "$out" | tail -1 | sed 's/.*found in: //' | tr -d '\r')
          command -v cygpath >/dev/null 2>&1 && [ -n "$log" ] && log=$(cygpath -u "$log")
          if [ -n "$log" ] && [ -f "$log" ]; then
            echo "===== $log (last 120 lines; 'verbose stack' shows where npm crashed) ====="
            tail -120 "$log"
          else
            echo "npm debug log not found (looked for: ${log:-<none>})"
          fi
          echo "::error title=npm install failed::See the npm debug log printed above."
          exit 1

      # legacy-peer-deps (workflow env above) stops npm from auto-installing
      # peer dependencies. Anything a package needs as a NON-optional peer but
      # that package.json does not list is then simply absent - e.g. unit tests
      # died with "Cannot find module '@testing-library/dom'" (a peer of
      # @testing-library/react). This finds every missing required peer in
      # node_modules and installs it with --no-save, using the range the
      # dependent package asks for. It loops because a new peer can have peers.
      # All specs go in ONE install each round: a later `npm install --no-save`
      # prunes packages that earlier --no-save installs added, so they must be
      # re-requested together. The list is saved to $RUNNER_TEMP/extra-peers.txt
      # for any later `npm install --no-save` in the job (bundler check step).
      # Permanent fix: add these packages to devDependencies in package.json.
      - name: Install missing peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP:-/tmp}/extra-peers.txt"
          : > "$list"
          for round in 1 2 3; do
            node -e '
              const fs=require("fs"),path=require("path");
              const want=new Map();
              function scan(dir){
                if(!fs.existsSync(dir))return;
                for(const n of fs.readdirSync(dir)){
                  if(n.startsWith("."))continue;
                  const p=path.join(dir,n);
                  if(n.startsWith("@")){scan(p);continue;}
                  const pj=path.join(p,"package.json");
                  if(!fs.existsSync(pj))continue;
                  let j;try{j=JSON.parse(fs.readFileSync(pj,"utf8"))}catch{continue}
                  const meta=j.peerDependenciesMeta||{};
                  for(const [d,v] of Object.entries(j.peerDependencies||{})){
                    if(meta[d]&&meta[d].optional)continue;
                    if(fs.existsSync(path.join("node_modules",d,"package.json")))continue;
                    if(!want.has(d)){want.set(d,v);console.error("missing peer: "+d+"@"+v+" (wanted by "+j.name+")");}
                  }
                }
              }
              scan("node_modules");
              for(const [d,v] of want)console.log(d+"@"+v);
            ' > "$list.new"
            if [ ! -s "$list.new" ]; then echo "No missing peer dependencies (round $round)."; break; fi
            cat "$list.new" >> "$list"
            sort -u "$list" -o "$list"
            specs=(); while IFS= read -r l; do l="${l%$'\r'}"; [ -n "$l" ] && specs+=("$l"); done < "$list"
            echo "Round $round: npm install --no-save ${specs[*]}"
            npm install --no-save --no-audit --no-fund "${specs[@]}"
          done
          rm -f "$list.new"
          echo "::notice title=Peers installed by CI::$(tr '\n' ' ' < "$list")- add these to devDependencies in package.json."

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow: eslint exits non-zero only on ERRORS (warnings do
      # not fail it), and swallowing that reported "43 problems (9 errors, 34
      # warnings)" as a green build. Errors gate; the 34 warnings still do not.
      - run: npm run lint

  # See lint above: no `if:` - this must run on every PR into main, not just
  # ones from `release` / `hotfix/*`.
  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
