# ============================================================================
# CI / main
#
# Structurally identical to ci-release.yml but for the main branch.
# Produces production-ready artifacts that will be PROMOTED to the stable
# feed (not directly published).
#
# Flow:
#   develop -> release -> main  ... then tag v1.2.3 -> publish-stable.yml
#
# Doc reference: section 5.4
# ============================================================================
name: CI / main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Manual trigger - emergency cases
  workflow_dispatch:

# ── Work around npm's peer-resolution crash ─────────────────────────────────
# Every job died in `npm install` with
#   npm error Cannot read properties of null (reading 'edgesOut')
# The debug log's `verbose stack` pins it: arborist #loadPeerSet crashes while
# resolving the peer set of node_modules/vitest (last manifests fetched:
# @vitest/coverage-istanbul@4.1.11, @vitest/coverage-v8@4.1.11, jsdom, canvas).
# That is an npm 10 bug: a peer-dependency conflict crashes the tree builder
# instead of reporting ERESOLVE. legacy-peer-deps skips peer-set resolution, so
# the crash path is never reached. Set as an env var so it covers EVERY npm
# call in every job and container (including the Rollup WASM `npm install`).
# Proper fix: put vitest and every @vitest/* package on the same exact version
# in package.json; after that this line can be removed.
env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

# ── About the "Install dependencies" step used in every job ─────────────────
# Replaces a bare `npm install`, which died on all 5 jobs with:
#   npm error Cannot read properties of null (reading 'edgesOut')
# That is a crash inside npm's tree builder (arborist). Cause found: peer
# resolution for vitest - see the workflow-level `env:` above. Earlier notes:
#   - It is not the lockfile: with package-lock.json AND node_modules deleted,
#     the install crashed the same way ~100ms after starting, before any
#     download - so it comes from package.json / repo contents / .npmrc.
#   - A missing file:/link: folder or workspace does not reproduce it on
#     npm 10.9 / Node 22 (tested), so that is not the explanation either.
# The step:
#   1. deletes any node_modules that came in with the checkout,
#   2. installs, and on failure prints the tail of THIS install's debug log,
#      whose `verbose stack` lines show where npm crashed.
#      (The log path is taken from npm's own output. Picking the newest file in
#      _logs is wrong: any later npm command, even `npm config get`, writes a
#      newer log and hides the crash - which is what an earlier version did.)
# No lockfile-less retry: it did not help, and a build without the lockfile
# would pull unpinned dependency versions.
# The step is repeated verbatim in each job; keep the copies in sync.

jobs:
  # lint and test-unit run on every event (no `if:`), including every PR into main.
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm 10.9.x (bundled with Node 22) crashes in `npm install` with
      # "Cannot read properties of null (reading 'edgesOut')". 10.8.2 does not.
      # Same fix as ci-release.yml / build-installers.yml.
      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        shell: bash
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow: eslint fails only on errors, so real errors fail the build.
      - run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm 10.9.x (bundled with Node 22) crashes in `npm install` with
      # "Cannot read properties of null (reading 'edgesOut')". 10.8.2 does not.
      # Same fix as ci-release.yml / build-installers.yml.
      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        shell: bash
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # @testing-library/react needs @testing-library/dom as a peer; the
      # --legacy-peer-deps fallback above does not install peers.
      - name: Ensure @testing-library/dom is installed
        run: npm ls @testing-library/dom || npm install --no-save @testing-library/dom

      # No `|| echo` swallow: `package` depends on this job, so it must be able to go red.
      # (TZ is inert - vitest.config.ts pins TZ=UTC.)
      - name: Run unit tests
        env:
          TZ: Asia/Kolkata
        run: npm test

  # Offline docs (helios-docs.zip) for the stable release - same steps as
  # build-docs in build-installers.yml. publish-stable.yml attaches the
  # `stable-installer-docs` artifact to the GitHub Release.
  docs:
    name: Build Documentation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install docs dependencies
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -r docs/requirements.txt

      - name: Cache docs offline assets
        uses: actions/cache@v4
        with:
          path: .cache/plugin/privacy
          key: docs-offline-cache-${{ hashFiles('docs/requirements.txt', 'mkdocs.yml') }}
          restore-keys: |
            docs-offline-cache-

      - name: Check docs build (strict)
        run: npm run docs:build

      - name: Build offline docs copy (helios-docs.zip)
        run: npm run docs:offline

      - name: Upload docs (for publish-stable to download later)
        uses: actions/upload-artifact@v5
        with:
          name: stable-installer-docs
          path: helios-docs.zip
          retention-days: 30
          if-no-files-found: error

