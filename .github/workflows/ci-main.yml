      #         ... ca-certificates ... 404  Not Found
      # and archive.debian.org does not carry bullseye-security (yet).
      #
      # Fix, before any other apt call:
      #   - bullseye + bullseye-updates -> archive.debian.org (permanent home)
      #   - bullseye-security           -> snapshot.debian.org, frozen at the
      #     last LTS publish. Keeping security matters: the image already has
      #     security-updated libraries installed, and without that suite apt
      #     cannot find matching -dev packages (unmet "= version" deps).
      #   - Check-Valid-Until off: EOL Release files have an expired Valid-Until.
      # If snapshot.debian.org is unreachable, it falls back to archive-only
      # and warns. See docs/ci-cd-workflow.md -> Troubleshooting.
      # TODO: when archive.debian.org publishes debian-security/bullseye-security,
      # swap the snapshot URL for it.
      - name: Point apt at archived Debian bullseye repos (ubuntu20.04)
        if: matrix.label == 'ubuntu20.04'
        shell: bash
        run: |
          set -euo pipefail
          SNAP=20260901T000000Z
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat > /etc/apt/apt.conf.d/99eol-bullseye <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::Retries "5";
          EOF
          write_sources() {
            {
              echo "deb http://archive.debian.org/debian bullseye main"
              echo "deb http://archive.debian.org/debian bullseye-updates main"
              if [ "${1:-}" = with-security ]; then
                echo "deb http://snapshot.debian.org/archive/debian-security/${SNAP} bullseye-security main"
              fi
