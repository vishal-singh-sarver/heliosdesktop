# ============================================================================
# CI / main
#
# Structurally identical to ci-release.yml but for the main branch.
# Produces production-ready artifacts that will be PROMOTED to the stable
# feed (not directly published).
#
# Flow:
#   develop -> release -> main  ... then tag v1.2.3 -> publish-stable.yml
#
# Doc reference: section 5.4
# ============================================================================
name: CI / main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Manual trigger - emergency cases
  workflow_dispatch:

jobs:
  # lint and test-unit run on every event (no `if:`), including every PR into main.
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Create .env file
        run: cp .env.example .env

      # No `|| echo` swallow: eslint fails only on errors, so real errors fail the build.
      - run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Create .env file
        run: cp .env.example .env

      # No `|| echo` swallow: `package` depends on this job, so it must be able to go red.
      # (TZ is inert - vitest.config.ts pins TZ=UTC.)
      - name: Run unit tests
        env:
          TZ: Asia/Kolkata
        run: npm test

  # Offline docs (helios-docs.zip) for the stable release - same steps as
  # build-docs in build-installers.yml. publish-stable.yml attaches the
  # `stable-installer-docs` artifact to the GitHub Release.
  docs:
    name: Build Documentation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install docs dependencies
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -r docs/requirements.txt

      - name: Cache docs offline assets
        uses: actions/cache@v4
        with:
          path: .cache/plugin/privacy
          key: docs-offline-cache-${{ hashFiles('docs/requirements.txt', 'mkdocs.yml') }}
          restore-keys: |
            docs-offline-cache-

      - name: Check docs build (strict)
        run: npm run docs:build

      - name: Build offline docs copy (helios-docs.zip)
        run: npm run docs:offline

      - name: Upload docs (for publish-stable to download later)
        uses: actions/upload-artifact@v5
        with:
          name: stable-installer-docs
          path: helios-docs.zip
          retention-days: 30
          if-no-files-found: error

  test-integration:
    # Builds the app + runs e2e, so it is a build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    name: Integration Tests (${{ matrix.os }})
    # Caps the job (GitHub default is 6h); keep it above the e2e step's 60 min.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      # e2e spikes to 50-57G on the ubuntu runner, so free ~20GB first.
      # Must run BEFORE setup-node and must not touch /opt/hostedtoolcache.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/.ghcup \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          sudo apt-get clean || true
          docker image prune -af || true
          echo "=== after ==="; df -h /

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libnss3 libxss1 libasound2t64 \
            libxtst6 libxrandr2 libatk1.0-0 libatk-bridge2.0-0 libdrm2 \
            libgbm1 libxkbcommon0 fonts-liberation xdg-utils \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Build Application for Integration Testing
        run: npm run build

      # No continue-on-error: a failing e2e must fail the job (and skip `package`).
      - name: Run Integration Checks
        timeout-minutes: 60
        run: npm run e2e

      # Keep each failure's details (allure-results), even when e2e failed.
      - name: Upload e2e results (diagnostic)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results-${{ matrix.os }}
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

      # The only view into an app that died during init.
      - name: Dump app startup + backend logs (diagnostic)
        if: always()
        shell: bash
        run: |
          found=0
          for d in "$HOME/Library/Application Support/Helios" \
                   "$HOME/.config/Helios" \
                   "${APPDATA:-}/Helios"; do
            [ -d "$d/logs" ] || continue
            for f in "$d/logs"/*.log; do
              [ -f "$f" ] || continue
              found=1
              echo "===== $f (last 100 lines) ====="
              tail -100 "$f" || true
            done
          done
          [ "$found" = 1 ] || echo "no Helios logs found - the app may have died before writeEarlyLog ran"

  package:
    name: Package & Sign ${{ matrix.label }}
    # Installer/package build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test-unit
      - test-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - single build
          - label: windows
            os: windows-2022

          # macOS Intel (x86_64)
          - label: macos-intel
            os: macos-15-intel
            arch_suffix: "-intel"

          # macOS Apple Silicon (arm64)
          - label: macos-apple-silicon
            os: macos-15
            arch_suffix: "-apple-silicon"

          # Ubuntu 20.04 - via python:3.10-bullseye container
          # (glibc 2.31, Python 3.10 prebuilt - deadsnakes was flaky)
          - label: ubuntu20.04
            os: ubuntu-latest
            container: python:3.10-bullseye
            ubuntu_suffix: "-ubuntu20.04"

          # Ubuntu 22.04
          - label: ubuntu22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            ubuntu_suffix: "-ubuntu22.04"

          # Ubuntu 24.04 - has t64-suffixed packages, handled by the fallback below
          - label: ubuntu24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            ubuntu_suffix: "-ubuntu24.04"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Debian 11 (bullseye) LTS ended 2026-08-31: deb.debian.org now returns
      # 404 for bullseye-security packages. Use the archive for main/updates and
      # the last snapshot for security (the image already has security-updated
      # libs, so -dev packages need that suite). Must run before any apt call.
      - name: Point apt at archived Debian bullseye repos (ubuntu20.04)
        if: matrix.label == 'ubuntu20.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          printf 'Acquire::Check-Valid-Until "false";\nAcquire::Retries "5";\n' > /etc/apt/apt.conf.d/99eol-bullseye
          {
            echo "deb http://archive.debian.org/debian bullseye main"
            echo "deb http://archive.debian.org/debian bullseye-updates main"
            echo "deb http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main"
          } > /etc/apt/sources.list
          if ! apt-get update; then
            echo "::warning::snapshot.debian.org unreachable - continuing without bullseye-security"
            sed -i '/bullseye-security/d' /etc/apt/sources.list
            apt-get update
          fi

      - name: Install git in container (pre-checkout)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup container base tools (Linux)
        if: matrix.container
        run: |
          set -e
          apt-get update
          apt-get install -y \
            curl git gnupg \
            python3-venv python3-pip \
            build-essential cmake pkg-config \
            libgtk-3-dev libnss3 libxss1 libfuse2 \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libx11-dev libxext-dev libxrender-dev \
            libglew-dev libglfw3-dev \
            zlib1g-dev libpng-dev libjpeg-dev

          # Fallback function for Ubuntu 24.04's t64-suffixed packages
          install_one() {
            apt-get install -y "$1" 2>/dev/null \
              || apt-get install -y "${1}t64" 2>/dev/null \
              || echo "Skipped: $1 (neither variant available)"
          }
          install_one libasound2
          install_one libatk1.0-0
          install_one libatk-bridge2.0-0
          install_one libxtst6
          install_one libxrandr2
          install_one libdrm2
          install_one libgbm1
          install_one libxkbcommon0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Imports the Developer ID certs into a throwaway keychain. The .p12 in
      # APPLE_CERTIFICATE holds BOTH certs we need:
      #   Developer ID Application -> signs the .app and the backend binary
      #   Developer ID Installer   -> signs the .pkg (productbuild finds it here)
      - name: Import Apple certificates (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty secret decodes to an empty file, which `security import`
          # rejects with the unhelpful "One or more parameters ... not valid".
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::error title=Apple certificate missing::APPLE_CERTIFICATE is empty or not visible to this job. Add it as a Repository secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # Strip line breaks/spaces that pasting the base64 into the secret adds.
          echo "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > certificate.p12
          [ -s certificate.p12 ] || { echo "::error::APPLE_CERTIFICATE decoded to an empty file"; exit 1; }
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Keep the keychain unlocked for the whole job; the default 5-minute
          # idle timeout can lock it mid-notarization and break pkg signing.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm certificate.p12
          echo "== identities available to the build =="
          security find-identity -v
          # Both certs must be present or the build silently degrades: without
          # the Application cert the .app is unsigned; without the Installer
          # cert the .pkg is unsigned and Gatekeeper blocks the installer.
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }

      - name: Install dependencies
        shell: bash
        run: npm install

      # Rollup's prebuilt linux-x64-gnu addon needs GLIBC_2.32; the 20.04 job
      # builds in bullseye (glibc 2.31). Vite 7 builds with rollup, so swap in
      # the WASM build. Skipped if the native addon already loads.
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == 'ubuntu20.04'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f node_modules/rollup/package.json ]; then
            echo "rollup not installed - no WASM shim needed."
            exit 0
          fi
          if node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null; then
            echo "rollup native addon loads - no WASM shim needed."
            exit 0
          fi
          version=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "rollup $version - installing matching @rollup/wasm-node"
          npm install --no-save "@rollup/wasm-node@${version}"
          target=node_modules/@rollup/rollup-linux-x64-gnu
          rm -rf "$target"
          mkdir -p "$target"
          cat > "$target/package.json" <<'JSON'
          { "name": "@rollup/rollup-linux-x64-gnu", "version": "0.0.0-wasm-shim", "main": "index.js" }
          JSON
          echo "module.exports = require('@rollup/wasm-node/dist/native.js')" > "$target/index.js"
          node -e "
            const m = require('@rollup/rollup-linux-x64-gnu')
            const need = ['parse','parseAsync','xxhashBase64Url','xxhashBase36','xxhashBase16']
            const missing = need.filter(k => typeof m[k] === 'undefined')
            if (missing.length) { console.error('WASM shim missing: ' + missing.join(', ')); process.exit(1) }
            console.log('rollup native require -> WASM shim OK')
          "

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Inject Missing Backend Migration Directories
        shell: bash
        run: |
          mkdir -p helios-desktop-backend/app/db/migrations
          touch helios-desktop-backend/app/db/migrations/.gitkeep

      # Non-macOS: unchanged single-shot build+package.
      - name: Package (production artifacts)
        if: ${{ !startsWith(matrix.label, 'macos') }}
        run: npm run package
        timeout-minutes: 60

      # macOS: build, THEN sign the Python backend, THEN package - `npm run package`
      # would re-run the build and wipe the backend signature.
      - name: Build application (macOS)
        if: startsWith(matrix.label, 'macos')
        run: npm run build

      - name: Sign Python backend (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # Long timeout: notarization waits on Apple's notary service.
      - name: Package (production artifacts, macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:only
        timeout-minutes: 180

      # The notarization hooks no-op silently without APPLE_* secrets, so assert it.
      - name: Verify signing and notarization (macOS)
        if: startsWith(matrix.label, 'macos')
        shell: bash
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== Gatekeeper assessment (.app) =="
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi

          echo "== stapler validate (.app) =="
          xcrun stapler validate "$app"

          echo "== .pkg signature + notarization =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            xcrun stapler validate "$pkg"
          done

          echo "PASS: .app and .pkg are signed, notarized and stapled; sidecar is signed."

      - name: Rename macOS output with arch suffix
        if: matrix.arch_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.pkg *.dmg; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.arch_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # AppImage builds are disabled - only .deb is renamed/uploaded.
      - name: Rename Linux output with ubuntu version
        if: matrix.ubuntu_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.deb; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.ubuntu_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      - name: Upload artifacts (for publish-stable to download later)
        uses: actions/upload-artifact@v5
        with:
          name: stable-installer-${{ matrix.label }}
          # Only the installers - the full dist/ has files a Release cannot attach.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*.deb
          retention-days: 30
          if-no-files-found: error

      # Deletes build.keychain - the keychain the import step actually creates.
      - name: Remove temporary keychain
        if: startsWith(matrix.label, 'macos') && always()
        run: security delete-keychain build.keychain || true