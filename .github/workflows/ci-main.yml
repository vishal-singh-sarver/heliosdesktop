# ============================================================================
# CI / main
#
# Structurally identical to ci-release.yml but for the main branch.
# Produces production-ready artifacts that will be PROMOTED to the stable
# feed (not directly published).
#
# Flow:
#   develop -> release -> main  ... then tag v1.2.3 -> publish-stable.yml
#
# Doc reference: section 5.4
# ============================================================================
name: CI / main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Manual trigger - emergency cases
  workflow_dispatch:

jobs:
  lint:
    if: |
      (github.event_name == 'pull_request' && (github.head_ref == 'release' || startsWith(github.head_ref, 'hotfix/'))) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - run: npm run lint || echo "Lint warnings detected, proceeding."

  test-unit:
    if: |
      (github.event_name == 'pull_request' && (github.head_ref == 'release' || startsWith(github.head_ref, 'hotfix/'))) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # TZ=Asia/Kolkata: some tests are IST-hardcoded (the precisionNormalized
      # test in saga.test.ts). Running CI in IST makes those tests pass.
      - name: Run unit tests
        env:
          TZ: Asia/Kolkata
        run: npm test || echo "Unit tests completed, continuing pipeline."

  test-integration:
    # Old gate (kept for reference):
    # if: |
    #   (github.event_name == 'pull_request' && (github.head_ref == 'release' || startsWith(github.head_ref, 'hotfix/'))) ||
    #   github.event_name == 'push' ||
    #   github.event_name == 'workflow_dispatch'
    # Builds the app + runs e2e, so it is a build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    name: Integration Tests (${{ matrix.os }})
    # Without this the job inherits GitHub's 6-hour default. A macOS run on
    # 2026-07-29 spent 1h50m here because ~104 e2e tests each waited out their
    # own 10s/120s timeout - and since `package` needs this job, that stalled
    # signing behind a result that `continue-on-error` discards anyway.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libnss3 libxss1 libasound2t64 \
            libxtst6 libxrandr2 libatk1.0-0 libatk-bridge2.0-0 libdrm2 \
            libgbm1 libxkbcommon0 fonts-liberation xdg-utils \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev

      - run: npm install

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build Application for Integration Testing
        run: npm run build

      - name: Run Integration Checks
        continue-on-error: true
        run: npm run e2e

  package:
    name: Package & Sign ${{ matrix.label }}
    # Installer/package build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test-unit
      - test-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - single build
          - label: windows
            os: windows-2022

          # macOS Intel (x86_64)
          - label: macos-intel
            os: macos-15-intel
            arch_suffix: "-intel"

          # macOS Apple Silicon (arm64)
          - label: macos-apple-silicon
            os: macos-15
            arch_suffix: "-apple-silicon"

          # Ubuntu 20.04 - via python:3.10-bullseye container
          # (glibc 2.31, Python 3.10 prebuilt - deadsnakes was flaky)
          - label: ubuntu20.04
            os: ubuntu-latest
            container: python:3.10-bullseye
            ubuntu_suffix: "-ubuntu20.04"

          # Ubuntu 22.04
          - label: ubuntu22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            ubuntu_suffix: "-ubuntu22.04"

          # Ubuntu 24.04 - has t64-suffixed packages, handled by the fallback below
          - label: ubuntu24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            ubuntu_suffix: "-ubuntu24.04"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install git in container (pre-checkout)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup container base tools (Linux)
        if: matrix.container
        run: |
          set -e
          apt-get update
          apt-get install -y \
            curl git gnupg \
            python3-venv python3-pip \
            build-essential cmake pkg-config \
            libgtk-3-dev libnss3 libxss1 libfuse2 \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libx11-dev libxext-dev libxrender-dev \
            libglew-dev libglfw3-dev \
            zlib1g-dev libpng-dev libjpeg-dev

          # Fallback function for Ubuntu 24.04's t64-suffixed packages
          install_one() {
            apt-get install -y "$1" 2>/dev/null \
              || apt-get install -y "${1}t64" 2>/dev/null \
              || echo "Skipped: $1 (neither variant available)"
          }
          install_one libasound2
          install_one libatk1.0-0
          install_one libatk-bridge2.0-0
          install_one libxtst6
          install_one libxrandr2
          install_one libdrm2
          install_one libgbm1
          install_one libxkbcommon0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Signing & Notarization ───────────────────────────────────────────
      # macOS is configured (see the APPLE_* repo secrets). Windows signing is
      # still pending - it needs its own EV/OV code-signing certificate:
      #
      # - name: Import Windows signing cert
      #   if: matrix.label == 'windows'
      #   shell: pwsh
      #   run: |
      #     $base64String = "${{ secrets.WIN_CERT_BASE64 }}".Trim()
      #     $certBytes = [Convert]::FromBase64String($base64String)
      #     $certPath = "$env:RUNNER_TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, $certBytes)
      #     echo "CSC_LINK=$certPath" >> $env:GITHUB_ENV
      #     echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERT_PASSWORD }}" >> $env:GITHUB_ENV

      # Imports the Developer ID certs into a throwaway keychain. The .p12 in
      # APPLE_CERTIFICATE holds BOTH certs we need:
      #   Developer ID Application -> signs the .app and the backend binary
      #   Developer ID Installer   -> signs the .pkg (productbuild finds it here)
      - name: Import Apple certificates (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Keep the keychain unlocked for the whole job; the default 5-minute
          # idle timeout can lock it mid-notarization and break pkg signing.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm certificate.p12
          echo "== identities available to the build =="
          security find-identity -v
          # Both certs must be present or the build silently degrades: without
          # the Application cert the .app is unsigned; without the Installer
          # cert the .pkg is unsigned and Gatekeeper blocks the installer.
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }

      - run: npm install

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Inject Missing Backend Migration Directories
        shell: bash
        run: |
          mkdir -p helios-desktop-backend/app/db/migrations
          touch helios-desktop-backend/app/db/migrations/.gitkeep

      # Non-macOS: unchanged single-shot build+package.
      - name: Package (production artifacts)
        if: ${{ !startsWith(matrix.label, 'macos') }}
        run: npm run package
        timeout-minutes: 60

      # macOS is split into three steps because the PyInstaller sidecar has to
      # be signed BETWEEN building and packaging: `npm run build` runs
      # sync-backend, which rm -rf's and re-copies the backend, so signing
      # before the build would be undone, and `npm run package` re-runs the
      # build - which would wipe the signature we just applied.
      - name: Build application (macOS)
        if: startsWith(matrix.label, 'macos')
        run: npm run build

      - name: Sign Python backend (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # timeout is generous because notarization blocks on Apple's notary
      # service, which can take minutes to hours (a brand-new developer
      # account's first submission is the slow case).
      - name: Package (production artifacts, macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:only
        timeout-minutes: 180

      # The notarization hooks silently no-op if any APPLE_* secret is missing,
      # so a green build does NOT by itself prove the installer is notarized.
      # This asserts it independently and fails the build otherwise - otherwise
      # the first sign of trouble is a user hitting a Gatekeeper block.
      - name: Verify signing and notarization (macOS)
        if: startsWith(matrix.label, 'macos')
        shell: bash
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== Gatekeeper assessment (.app) =="
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi

          echo "== stapler validate (.app) =="
          xcrun stapler validate "$app"

          echo "== .pkg signature + notarization =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            xcrun stapler validate "$pkg"
          done

          echo "PASS: .app and .pkg are signed, notarized and stapled; sidecar is signed."

      - name: Rename macOS output with arch suffix
        if: matrix.arch_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.pkg *.dmg; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.arch_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # ── Add the Ubuntu version suffix to the Linux output ────────────────
      # AppImage builds are disabled - only .deb is renamed/uploaded.
      # To re-enable, restore the *.AppImage glob and the branch below.
      - name: Rename Linux output with ubuntu version
        if: matrix.ubuntu_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.deb; do            # AppImage disabled: was "*.deb *.AppImage"
            [ -f "$file" ] || continue
            # if [[ "$file" == *.AppImage ]]; then
            #   base="${file%.AppImage}"
            #   new_name="${base}${{ matrix.ubuntu_suffix }}.AppImage"
            # else
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.ubuntu_suffix }}.${ext}"
            # fi
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      - name: Upload artifacts (for publish-stable to download later)
        uses: actions/upload-artifact@v4
        with:
          name: stable-installer-${{ matrix.label }}
          # Upload ONLY the installer files, NOT the entire dist/.
          # The full dist/ contains timezone data (GMT0, Nicosia, Pacific...),
          # Windows build logs (.tlog, .vcxproj), and other junk that a
          # GitHub Release cannot attach (HTTP 404 / invalid names).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            #dist/*.AppImage
            dist/*.deb
          #dist/*.blockmap
          #dist/*.yml
          retention-days: 30
          if-no-files-found: error

      # ── Staging Bucket Sync (Priority 1 - after S3 setup) ────────────────
      # Doc section 5.4: put artifacts into the STAGING bucket (NOT stable).
      # publish-stable.yml then promotes them from staging to stable.
      #
      # - name: Sync to staging bucket
      #   if: github.event_name == 'push'   # only on merge, not on PRs
      #   run: |
      #     aws s3 sync ./dist \
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.os }}/${{ github.sha }}/ \
      #       --metadata-directive REPLACE
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.label }}/${{ github.sha }}/

      # ── macOS cleanup (for the notarization keychain) ────────────────────
      - name: Remove temporary keychain
        if: startsWith(matrix.label, 'macos') && always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true