              done
            done
            [ "$n" -gt 0 ] || fail "the .p12 contains no private key that matches a certificate. Export it from Keychain Access with the private keys (expand each certificate and select the key too)."
            # APPLE_CSC_LINK stays empty: electron-builder auto-discovers the identities
            # in build.keychain (see the mac: comment in electron-builder.yml).
            echo "Imported $n repacked identities. electron-builder will use keychain auto-discovery."
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KC_PASS" "$KC" >/dev/null

          rm -rf "$WORK"

          # ── 5. Both identities must be present or signing silently degrades ─────────
          echo "== identities available to the build =="
          security find-identity -v "$KC"
          ids=$(security find-identity -v "$KC")
          missing=""
          echo "$ids" | grep -q "Developer ID Application" || missing="$missing 'Developer ID Application' (signs the .app)"
          echo "$ids" | grep -q "Developer ID Installer" || missing="$missing 'Developer ID Installer' (signs the .pkg)"
          if [ -n "$missing" ]; then
            if [ "$REQUIRE" = 1 ]; then
              fail "the .p12 is missing:$missing. Export BOTH certificates with their private keys into one .p12."
            fi
            echo "::warning title=Incomplete signing identities::missing:$missing"
          fi
          echo "Apple certificates imported into $KC."

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          echo "node $(node -v), npm $(npm -v)"
          rm -rf node_modules
          out="${RUNNER_TEMP:-/tmp}/npm-install-output.txt"
          if npm install --no-audit --no-fund 2>&1 | tee "$out"; then exit 0; fi
          log=$(grep -o 'A complete log of this run can be found in: .*' "$out" | tail -1 | sed 's/.*found in: //' | tr -d '\r')
          command -v cygpath >/dev/null 2>&1 && [ -n "$log" ] && log=$(cygpath -u "$log")
          if [ -n "$log" ] && [ -f "$log" ]; then
            echo "===== $log (last 120 lines; 'verbose stack' shows where npm crashed) ====="
            tail -120 "$log"
          else
            echo "npm debug log not found (looked for: ${log:-<none>})"
          fi
          echo "::error title=npm install failed::See the npm debug log printed above."
          exit 1

      # legacy-peer-deps (workflow env above) stops npm from auto-installing
      # peer dependencies. Anything a package needs as a NON-optional peer but
      # that package.json does not list is then simply absent - e.g. unit tests
      # died with "Cannot find module '@testing-library/dom'" (a peer of
      # @testing-library/react). This finds every missing required peer in
      # node_modules and installs it with --no-save, using the range the
      # dependent package asks for. It loops because a new peer can have peers.
      # All specs go in ONE install each round: a later `npm install --no-save`
      # prunes packages that earlier --no-save installs added, so they must be
      # re-requested together. The list is saved to $RUNNER_TEMP/extra-peers.txt
      # for any later `npm install --no-save` in the job (bundler check step).
      # Permanent fix: add these packages to devDependencies in package.json.
      - name: Install missing peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP:-/tmp}/extra-peers.txt"
          : > "$list"
          for round in 1 2 3; do
            node -e '
              const fs=require("fs"),path=require("path");
              const want=new Map();
              function scan(dir){
                if(!fs.existsSync(dir))return;
                for(const n of fs.readdirSync(dir)){
                  if(n.startsWith("."))continue;
                  const p=path.join(dir,n);
                  if(n.startsWith("@")){scan(p);continue;}
                  const pj=path.join(p,"package.json");
                  if(!fs.existsSync(pj))continue;
                  let j;try{j=JSON.parse(fs.readFileSync(pj,"utf8"))}catch{continue}
                  const meta=j.peerDependenciesMeta||{};
                  for(const [d,v] of Object.entries(j.peerDependencies||{})){
                    if(meta[d]&&meta[d].optional)continue;
                    if(fs.existsSync(path.join("node_modules",d,"package.json")))continue;
                    if(!want.has(d)){want.set(d,v);console.error("missing peer: "+d+"@"+v+" (wanted by "+j.name+")");}
                  }
                }
              }
              scan("node_modules");
              for(const [d,v] of want)console.log(d+"@"+v);
            ' > "$list.new"
            if [ ! -s "$list.new" ]; then echo "No missing peer dependencies (round $round)."; break; fi
            cat "$list.new" >> "$list"
            sort -u "$list" -o "$list"
            specs=(); while IFS= read -r l; do l="${l%$'\r'}"; [ -n "$l" ] && specs+=("$l"); done < "$list"
            echo "Round $round: npm install --no-save ${specs[*]}"
            npm install --no-save --no-audit --no-fund "${specs[@]}"
          done
          rm -f "$list.new"
          echo "::notice title=Peers installed by CI::$(tr '\n' ' ' < "$list")- add these to devDependencies in package.json."

      # ── Bundler native binary vs glibc 2.31 (ubuntu20.04 only) ──────────
      # The ubuntu20.04 job builds in python:3.10-bullseye (glibc 2.31).
      #
      # There is no package-lock.json, so the bundler is whatever npm resolves
      # today. Vite 8 (pulled in by vitest 4) bundles with ROLLDOWN, not Rollup,
      # so node_modules/rollup no longer exists and the old step died with
      #   Error: Cannot find module './node_modules/rollup/package.json'
      # Rolldown's linux-x64-gnu binding only needs GLIBC_2.16, so it loads
      # fine on bullseye - no shim needed.
      #
      # Rollup (Vite <= 7) is still handled: its prebuilt linux-x64-gnu addon
      # needs GLIBC_2.32 and dies with ERR_DLOPEN_FAILED
      #   /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.32' not found
      # If Rollup is installed AND its native addon fails to load, the addon is
      # replaced with a stub re-exporting @rollup/wasm-node/dist/native.js
      # (same five symbols, no libc dependency). A reinstall would NOT help -
      # it fetches the same binary.
      #
      # So this step now: shims Rollup only when it is present and broken,
      # skips it when absent, and asserts that whatever bundler IS installed
      # actually loads - failing here with a clear message rather than deep
      # inside `npm run package`.
      - name: Check bundler native binary (glibc 2.31 container)
        if: matrix.label == 'ubuntu20.04'
        shell: bash
        run: |
          set -euo pipefail
          echo "glibc: $(ldd --version | head -1)"
          echo "vite:     $(node -p "require('./node_modules/vite/package.json').version" 2>/dev/null || echo 'not installed')"
          echo "rolldown: $(node -p "require('./node_modules/rolldown/package.json').version" 2>/dev/null || echo 'not installed')"
          echo "rollup:   $(node -p "require('./node_modules/rollup/package.json').version" 2>/dev/null || echo 'not installed')"

          # Rolldown (Vite 8+): just prove the native binding loads.
          if [ -f node_modules/rolldown/package.json ]; then
            node --input-type=module -e "await import('rolldown'); console.log('rolldown native binding loads OK')" \
              || { echo "::error title=rolldown failed to load::rolldown's native binding does not load in this container (glibc $(ldd --version | head -1 | awk '{print $NF}'))."; exit 1; }
          fi

          # Rollup (Vite <= 7): shim only if present and its native addon is unloadable.
          if [ ! -f node_modules/rollup/package.json ]; then
            echo "rollup not installed at top level - no WASM shim needed."
            exit 0
          fi
          if node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null; then
            echo "rollup native addon loads - no WASM shim needed."
            exit 0
          fi
          version=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "rollup $version native addon cannot load - installing matching @rollup/wasm-node"
          # Re-request the peers added earlier: --no-save installs prune
          # anything not in package.json unless listed again.
          extra=()
          list="${RUNNER_TEMP:-/tmp}/extra-peers.txt"
          if [ -s "$list" ]; then while IFS= read -r l; do l="${l%$'\r'}"; [ -n "$l" ] && extra+=("$l"); done < "$list"; fi
          npm install --no-save "@rollup/wasm-node@${version}" "${extra[@]}"
          target=node_modules/@rollup/rollup-linux-x64-gnu
          rm -rf "$target"
          mkdir -p "$target"
          echo '{ "name": "@rollup/rollup-linux-x64-gnu", "version": "0.0.0-wasm-shim", "main": "index.js" }' > "$target/package.json"
          echo "module.exports = require('@rollup/wasm-node/dist/native.js')" > "$target/index.js"
          node -e "
            const m = require('@rollup/rollup-linux-x64-gnu')
            const need = ['parse','parseAsync','xxhashBase64Url','xxhashBase36','xxhashBase16']
            const missing = need.filter(k => typeof m[k] === 'undefined')
            if (missing.length) { console.error('WASM shim missing: ' + missing.join(', ')); process.exit(1) }
            console.log('rollup native require -> WASM shim OK')
          "

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Inject Missing Backend Migration Directories
        shell: bash
        run: |
          mkdir -p helios-desktop-backend/app/db/migrations
          touch helios-desktop-backend/app/db/migrations/.gitkeep

      # Non-macOS: unchanged single-shot build+package.
      - name: Package (production artifacts)
        if: ${{ !startsWith(matrix.label, 'macos') }}
        run: npm run package
        timeout-minutes: 60

      # macOS is split into three steps because the PyInstaller sidecar has to
      # be signed BETWEEN building and packaging: `npm run build` runs
      # sync-backend, which rm -rf's and re-copies the backend, so signing
      # before the build would be undone, and `npm run package` re-runs the
      # build - which would wipe the signature we just applied.
      - name: Build application (macOS)
        if: startsWith(matrix.label, 'macos')
        run: npm run build

      - name: Sign Python backend (macOS)
        if: startsWith(matrix.label, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # timeout is generous because notarization blocks on Apple's notary
      # service, which can take minutes to hours (a brand-new developer
      # account's first submission is the slow case).
      # CSC_LINK is the .p12 the import step decoded (a file path, so a
      # whitespace-wrapped secret can no longer break electron-builder's own
      # import). It is EMPTY when that step had to repack the .p12; then
      # electron-builder auto-discovers the identities in build.keychain.
      - name: Package (production artifacts, macOS)
        if: startsWith(matrix.label, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          CSC_LINK: ${{ env.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:only
        timeout-minutes: 180

      # TEMPORARY fallback while APPLE_CERTIFICATE is missing: UNSIGNED and
      # un-notarized. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from hunting for an identity; SKIP_NOTARIZATION=1 short-circuits both
      # notarize hooks. No APPLE_* secrets are passed. Never ship this .pkg.
      - name: Package (macOS - UNSIGNED fallback, no certificate)
        if: startsWith(matrix.label, 'macos') && env.HAS_APPLE_CERT != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZATION: '1'
        run: npm run package:only
        timeout-minutes: 60

      # The notarization hooks silently no-op if any APPLE_* secret is missing,
      # so a green build does NOT by itself prove the installer is notarized.
      # This asserts it independently and fails the build otherwise - otherwise
      # the first sign of trouble is a user hitting a Gatekeeper block.
      # Skipped for the unsigned fallback - there is nothing to verify.
      - name: Verify signing and notarization (macOS)
        if: startsWith(matrix.label, 'macos') && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== Gatekeeper assessment (.app) =="
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi

          echo "== stapler validate (.app) =="
          xcrun stapler validate "$app"

          echo "== .pkg signature + notarization =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            xcrun stapler validate "$pkg"
          done

          echo "PASS: .app and .pkg are signed, notarized and stapled; sidecar is signed."

      - name: Rename macOS output with arch suffix
        if: matrix.arch_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.pkg *.dmg; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.arch_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # ── Add the Ubuntu version suffix to the Linux output ────────────────
      # AppImage builds are disabled - only .deb is renamed/uploaded.
      # To re-enable, restore the *.AppImage glob and the branch below.
      - name: Rename Linux output with ubuntu version
        if: matrix.ubuntu_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.deb; do            # AppImage disabled: was "*.deb *.AppImage"
            [ -f "$file" ] || continue
            # if [[ "$file" == *.AppImage ]]; then
            #   base="${file%.AppImage}"
            #   new_name="${base}${{ matrix.ubuntu_suffix }}.AppImage"
            # else
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.ubuntu_suffix }}.${ext}"
            # fi
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      - name: Upload artifacts (for publish-stable to download later)
        uses: actions/upload-artifact@v5
        with:
          name: stable-installer-${{ matrix.label }}
          # Upload ONLY the installer files, NOT the entire dist/.
          # The full dist/ contains timezone data (GMT0, Nicosia, Pacific...),
          # Windows build logs (.tlog, .vcxproj), and other junk that a
          # GitHub Release cannot attach (HTTP 404 / invalid names).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            #dist/*.AppImage
            dist/*.deb
          #dist/*.blockmap
          #dist/*.yml
          retention-days: 30
          if-no-files-found: error

      # ── Staging Bucket Sync (Priority 1 - after S3 setup) ────────────────
      # Doc section 5.4: put artifacts into the STAGING bucket (NOT stable).
      # publish-stable.yml then promotes them from staging to stable.
      #
      # - name: Sync to staging bucket
      #   if: github.event_name == 'push'   # only on merge, not on PRs
      #   run: |
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.os }}/${{ github.sha }}/ \
      #       --metadata-directive REPLACE
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.label }}/${{ github.sha }}/

      # ── macOS cleanup (for the notarization keychain) ────────────────────
      # Deletes the keychain the import step actually created (build.keychain).
      # The previous path, $RUNNER_TEMP/app-signing.keychain-db, never existed,
      # so the `|| true` hid a cleanup that did nothing.
      - name: Remove temporary keychain
        if: startsWith(matrix.label, 'macos') && env.HAS_APPLE_CERT == 'true' && always()
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/apple-codesign.p12"