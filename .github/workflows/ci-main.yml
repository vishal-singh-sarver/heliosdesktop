          out="${RUNNER_TEMP:-/tmp}/npm-install-output.txt"
          if npm install --no-audit --no-fund 2>&1 | tee "$out"; then exit 0; fi
          log=$(grep -o 'A complete log of this run can be found in: .*' "$out" | tail -1 | sed 's/.*found in: //' | tr -d '\r')
          command -v cygpath >/dev/null 2>&1 && [ -n "$log" ] && log=$(cygpath -u "$log")
          if [ -n "$log" ] && [ -f "$log" ]; then
            echo "===== $log (last 120 lines; 'verbose stack' shows where npm crashed) ====="
            tail -120 "$log"
          else
            echo "npm debug log not found (looked for: ${log:-<none>})"
          fi
          echo "::error title=npm install failed::See the npm debug log printed above."
          exit 1

      # legacy-peer-deps (workflow env above) stops npm from auto-installing
      # peer dependencies. Anything a package needs as a NON-optional peer but
      # that package.json does not list is then simply absent - e.g. unit tests
      # died with "Cannot find module '@testing-library/dom'" (a peer of
      # @testing-library/react). This finds every missing required peer in
      # node_modules and installs it with --no-save, using the range the
      # dependent package asks for. It loops because a new peer can have peers.
      # All specs go in ONE install each round: a later `npm install --no-save`
      # prunes packages that earlier --no-save installs added, so they must be
      # re-requested together. The list is saved to $RUNNER_TEMP/extra-peers.txt
      # for any later `npm install --no-save` in the job (bundler check step).
      # Permanent fix: add these packages to devDependencies in package.json.
      - name: Install missing peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP:-/tmp}/extra-peers.txt"
          : > "$list"
          for round in 1 2 3; do
            node -e '
              const fs=require("fs"),path=require("path");
              const want=new Map();
