# ============================================================================
# CI / main
#
# Structurally identical to ci-release.yml but for the main branch.
# Produces production-ready artifacts that will be PROMOTED to the stable
# feed (not directly published).
#
# Flow:
#   develop -> release -> main  ... then tag v1.2.3 -> publish-stable.yml
#
# Doc reference: section 5.4
# ============================================================================
name: CI / main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Manual trigger - emergency cases
  workflow_dispatch:

jobs:
  # lint and test-unit run on EVERY event that reaches this workflow - no `if:`.
  # They previously ran on PRs only when the head branch was `release` or
  # `hotfix/*`. Because a skipped job reports as successful, a PR into main from
  # any other branch name showed an all-green check run with nothing having
  # actually executed - the same "a check that cannot go red" failure mode the
  # continue-on-error comment below warns about. These two jobs are cheap
  # (ubuntu-only, no build), so gating them by branch name bought nothing.
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow: eslint exits non-zero only on ERRORS (warnings do
      # not fail it), and swallowing that reported "43 problems (9 errors, 34
      # warnings)" as a green build. Errors gate; the 34 warnings still do not.
      - run: npm run lint

  # See lint above: no `if:` - this must run on every PR into main, not just
  # ones from `release` / `hotfix/*`.
  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow. That form exits 0 even when vitest fails, so
      # test-unit could never go red - and `package` now depends on it, which
      # would make the new e2e gate leak: a failing unit suite would still sign
      # and publish installers. Same reasoning as the lint step above.
      #
      # TZ=Asia/Kolkata is inert: vitest.config.ts pins env TZ='UTC' internally,
      # which wins. Left in place because the suite passes either way (1299/1299
      # verified under UTC) - but do not rely on it to make an IST-hardcoded
      # test pass.
      - name: Run unit tests
        env:
          TZ: Asia/Kolkata
        run: npm test

  test-integration:
    # Old gate (kept for reference):
    # if: |
    #   (github.event_name == 'pull_request' && (github.head_ref == 'release' || startsWith(github.head_ref, 'hotfix/'))) ||
    #   github.event_name == 'push' ||
    #   github.event_name == 'workflow_dispatch'
    # Builds the app + runs e2e, so it is a build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    name: Integration Tests (${{ matrix.os }})
    # Without this the job inherits GitHub's 6-hour default. A macOS run on
    # 2026-07-29 spent 1h50m here because ~104 e2e tests each waited out their
    # own 10s/120s timeout - and since `package` needs this job, that stalled
    # signing behind a result that `continue-on-error` discards anyway.
    # Must stay above the e2e step's own cap below, or the job kills the step
    # first and the step timeout never takes effect.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      # Mirrors ci-release.yml - see the long comment there for the evidence.
      # Short version: the ubuntu runner's e2e working set SPIKES (~36G steady,
      # 50G and 57G during two specs) rather than growing, and without this
      # reclamation the spike exhausts the disk. It does not fail cleanly: the
      # app opens a window whose renderer never mounts, so specs fail as
      # renderer timeouts and hook failures that read like product bugs.
      #
      # MUST run BEFORE setup-node, and must NOT delete /opt/hostedtoolcache or
      # $AGENT_TOOLSDIRECTORY - setup-node installs node there, and deleting it
      # afterwards makes `npm install` die with "npm: command not found".
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/.ghcup \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          sudo apt-get clean || true
          docker image prune -af || true
          echo "=== after ==="; df -h /

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libnss3 libxss1 libasound2t64 \
            libxtst6 libxrandr2 libatk1.0-0 libatk-bridge2.0-0 libdrm2 \
            libgbm1 libxkbcommon0 fonts-liberation xdg-utils \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev

      - run: npm install

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build Application for Integration Testing
        run: npm run build

      # No continue-on-error: a failing e2e run must show up as a failing job.
      # It previously reported green - and `continue-on-error` does not merely
      # let the job proceed, it REWRITES the recorded conclusion, so both the
      # step and the job read "success" while the log showed `exit code 1`. A
      # check that cannot go red is worse than no check. `package` NOW GATES on
      # this job (see its `needs`), so a red run here skips the installers.
      #
      # bail is 0 (wdio.config.ts): every spec runs and the job fails at the end
      # with the full list, rather than stopping at the first failure and hiding
      # the rest. This timeout is what bounds the cost - a hung app or a wedged
      # wdio would otherwise bleed on three OSes at once, macOS billing at 10x.
      # A full healthy suite is ~13min locally and ~20min on CI, so 60min is a
      # backstop against a wedged run, not a budget.
      - name: Run Integration Checks
        timeout-minutes: 60
        run: npm run e2e

      # "Timeout exceeded to get the ContextId" is NOT itself proof of a crash.
      # wdio-electron-service races a Runtime.executionContextCreated listener
      # against an uncancelled setTimeout(cdpBridgeTimeout, default 10s); the
      # timer fires and logs at ERROR even when the context arrived and the run
      # passes. What matters is whether the bridge actually came up: if it did
      # not, browser.electron.* is swapped for stubs that throw. wdio.config.ts
      # now raises cdpBridgeTimeout and probes the bridge in `before`, so a real
      # failure aborts the first spec with a self-describing message instead of
      # degrading silently. Keep dumping the startup log anyway - it is still the
      # only view into an app that died during init. writeEarlyLog() in
      # src/main/index.ts appends to
      # <userData>/logs/app-startup.log from a path derived from getPath('home')
      # (NOT the automation-skipped userData override), so it survives the crash.
      # if: always() because the interesting case is exactly when e2e failed.
      - name: Dump app startup + backend logs (diagnostic)
        if: always()
        shell: bash
        run: |
          found=0
          for d in "$HOME/Library/Application Support/Helios" \
                   "$HOME/.config/Helios" \
                   "${APPDATA:-}/Helios"; do
            [ -d "$d/logs" ] || continue
            for f in "$d/logs"/*.log; do
              [ -f "$f" ] || continue
              found=1
              echo "===== $f (last 100 lines) ====="
              tail -100 "$f" || true
            done
          done
          [ "$found" = 1 ] || echo "no Helios logs found - the app may have died before writeEarlyLog ran"

  package:
    name: Package & Sign ${{ matrix.label }}
    # Installer/package build: only on push/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    # Gated on test-integration, matching ci-release.yml. This was deliberately
    # UNgated while e2e could not pass - a suite that is always red is not a
    # gate, it is a blocker - but run 30753157914 went green on all three
    # platforms, so the condition that comment set ("add it back once e2e is
    # reliably green") is met. main is what publish-stable.yml promotes to the
    # stable feed, so an artifact that ships should not come from a tree whose
    # e2e is failing.
    #
    # Consequence: a failing e2e SKIPS all six package jobs, and a skipped job
    # reports as SUCCESSFUL. A green check mark alone does not prove the
    # installers were built - confirm the package jobs actually ran before
    # tagging a release:
    #   gh run view <id> --json jobs --jq '.jobs[] | "\(.conclusion)\t\(.name)"'
    # publish-stable.yml is unaffected either way: it requires a successful
    # ci-main run for the tagged commit and downloads that run's artifacts, so
    # a skipped package job means the tag simply finds nothing to promote.
    needs:
      - lint
      - test-unit
      - test-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - single build
          - label: windows
            os: windows-2022

          # macOS Intel (x86_64)
          - label: macos-intel
            os: macos-15-intel
            arch_suffix: "-intel"

          # macOS Apple Silicon (arm64)
          - label: macos-apple-silicon
            os: macos-15
            arch_suffix: "-apple-silicon"

          # Ubuntu 20.04 - via python:3.10-bullseye container
          # (glibc 2.31, Python 3.10 prebuilt - deadsnakes was flaky)
          - label: ubuntu20.04
            os: ubuntu-latest
            container: python:3.10-bullseye
            ubuntu_suffix: "-ubuntu20.04"

          # Ubuntu 22.04
          - label: ubuntu22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            ubuntu_suffix: "-ubuntu22.04"

          # Ubuntu 24.04 - has t64-suffixed packages, handled by the fallback below
          - label: ubuntu24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            ubuntu_suffix: "-ubuntu24.04"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install git in container (pre-checkout)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup container base tools (Linux)
        if: matrix.container
        run: |
          set -e
          apt-get update
          apt-get install -y \
            curl git gnupg \
            python3-venv python3-pip \
            build-essential cmake pkg-config \
            libgtk-3-dev libnss3 libxss1 libfuse2 \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libx11-dev libxext-dev libxrender-dev \
            libglew-dev libglfw3-dev \
            zlib1g-dev libpng-dev libjpeg-dev

          # Fallback function for Ubuntu 24.04's t64-suffixed packages
          install_one() {
            apt-get install -y "$1" 2>/dev/null \
              || apt-get install -y "${1}t64" 2>/dev/null \
              || echo "Skipped: $1 (neither variant available)"
          }
          install_one libasound2
          install_one libatk1.0-0
          install_one libatk-bridge2.0-0
          install_one libxtst6
          install_one libxrandr2
          install_one libdrm2
          install_one libgbm1
          install_one libxkbcommon0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── Signing & Notarization ───────────────────────────────────────────
      # macOS is configured (see the APPLE_* repo secrets). Windows signing is
      # still pending - it needs its own EV/OV code-signing certificate:
      #
      # - name: Import Windows signing cert
      #   if: matrix.label == 'windows'
      #   shell: pwsh
      #   run: |
      #     $base64String = "${{ secrets.WIN_CERT_BASE64 }}".Trim()
      #     $certBytes = [Convert]::FromBase64String($base64String)
      #     $certPath = "$env:RUNNER_TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, $certBytes)
      #     echo "CSC_LINK=$certPath" >> $env:GITHUB_ENV
      #     echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERT_PASSWORD }}" >> $env:GITHUB_ENV

      # Imports the Developer ID certs into a throwaway keychain. The .p12 in
      # APPLE_CERTIFICATE holds BOTH certs we need:
      #   Developer ID Application -> signs the .app and the backend binary
      #   Developer ID Installer   -> signs the .pkg (productbuild finds it here)
      - name: Import Apple certificates (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Keep the keychain unlocked for the whole job; the default 5-minute
          # idle timeout can lock it mid-notarization and break pkg signing.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm certificate.p12
          echo "== identities available to the build =="
          security find-identity -v
          # Both certs must be present or the build silently degrades: without
          # the Application cert the .app is unsigned; without the Installer
          # cert the .pkg is unsigned and Gatekeeper blocks the installer.
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }

      - run: npm install

      # Rollup ships a prebuilt native .node per platform and picks it purely by
      # process.platform/arch (dist/native.js getPackageBase) - there is no env
      # switch to opt out. The linux-x64-gnu build now needs GLIBC_2.32, but the
      # ubuntu20.04 job builds in python:3.10-bullseye (glibc 2.31), so loading
      # it dies with ERR_DLOPEN_FAILED and packaging fails:
      #   /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.32' not found
      # Rollup's own message blames npm's optional-dependency bug and suggests
      # reinstalling; that is a red herring here - the module IS present, it just
      # cannot be loaded, so a reinstall fetches the same incompatible binary.
      #
      # native.js requires that package BY NAME, so we replace it with a stub that
      # re-exports @rollup/wasm-node's own dist/native.js - the WASM-backed module
      # exposing the same five symbols (parse, parseAsync, xxhashBase64Url,
      # xxhashBase36, xxhashBase16), with no libc dependency. Note the wasm-node
      # package ROOT is a full Rollup (rollup/watch/defineConfig), NOT a drop-in
      # for the native addon; only its dist/native.js has what native.js wants.
      #
      # Scoped to this one container: a package.json `overrides` entry would force
      # WASM on macOS and Windows too, which are fine - and faster - on the native
      # binary. Only 20.04 needs it, and only until its glibc floor rises above
      # what Rollup targets.
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == 'ubuntu20.04'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "rollup $version - installing matching @rollup/wasm-node"
          npm install --no-save "@rollup/wasm-node@${version}"
          target=node_modules/@rollup/rollup-linux-x64-gnu
          rm -rf "$target"
          mkdir -p "$target"
          cat > "$target/package.json" <<'JSON'
          { "name": "@rollup/rollup-linux-x64-gnu", "version": "0.0.0-wasm-shim", "main": "index.js" }
          JSON
          echo "module.exports = require('@rollup/wasm-node/dist/native.js')" > "$target/index.js"
          # Fail loudly here rather than letting the build die later with the same
          # opaque dlopen error. Asserts the symbols native.js destructures.
          node -e "
            const m = require('@rollup/rollup-linux-x64-gnu')
            const need = ['parse','parseAsync','xxhashBase64Url','xxhashBase36','xxhashBase16']
            const missing = need.filter(k => typeof m[k] === 'undefined')
            if (missing.length) { console.error('WASM shim missing: ' + missing.join(', ')); process.exit(1) }
            console.log('rollup native require -> WASM shim OK')
          "

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Inject Missing Backend Migration Directories
        shell: bash
        run: |
          mkdir -p helios-desktop-backend/app/db/migrations
          touch helios-desktop-backend/app/db/migrations/.gitkeep

      # Non-macOS: unchanged single-shot build+package.
      - name: Package (production artifacts)
        if: ${{ !startsWith(matrix.label, 'macos') }}
        run: npm run package
        timeout-minutes: 60

      # macOS is split into three steps because the PyInstaller sidecar has to
      # be signed BETWEEN building and packaging: `npm run build` runs
      # sync-backend, which rm -rf's and re-copies the backend, so signing
      # before the build would be undone, and `npm run package` re-runs the
      # build - which would wipe the signature we just applied.
      - name: Build application (macOS)
        if: startsWith(matrix.label, 'macos')
        run: npm run build

      - name: Sign Python backend (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # timeout is generous because notarization blocks on Apple's notary
      # service, which can take minutes to hours (a brand-new developer
      # account's first submission is the slow case).
      - name: Package (production artifacts, macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:only
        timeout-minutes: 180

      # The notarization hooks silently no-op if any APPLE_* secret is missing,
      # so a green build does NOT by itself prove the installer is notarized.
      # This asserts it independently and fails the build otherwise - otherwise
      # the first sign of trouble is a user hitting a Gatekeeper block.
      - name: Verify signing and notarization (macOS)
        if: startsWith(matrix.label, 'macos')
        shell: bash
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== Gatekeeper assessment (.app) =="
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi

          echo "== stapler validate (.app) =="
          xcrun stapler validate "$app"

          echo "== .pkg signature + notarization =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            xcrun stapler validate "$pkg"
          done

          echo "PASS: .app and .pkg are signed, notarized and stapled; sidecar is signed."

      - name: Rename macOS output with arch suffix
        if: matrix.arch_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.pkg *.dmg; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.arch_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # ── Add the Ubuntu version suffix to the Linux output ────────────────
      # AppImage builds are disabled - only .deb is renamed/uploaded.
      # To re-enable, restore the *.AppImage glob and the branch below.
      - name: Rename Linux output with ubuntu version
        if: matrix.ubuntu_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.deb; do            # AppImage disabled: was "*.deb *.AppImage"
            [ -f "$file" ] || continue
            # if [[ "$file" == *.AppImage ]]; then
            #   base="${file%.AppImage}"
            #   new_name="${base}${{ matrix.ubuntu_suffix }}.AppImage"
            # else
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.ubuntu_suffix }}.${ext}"
            # fi
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      - name: Upload artifacts (for publish-stable to download later)
        uses: actions/upload-artifact@v5
        with:
          name: stable-installer-${{ matrix.label }}
          # Upload ONLY the installer files, NOT the entire dist/.
          # The full dist/ contains timezone data (GMT0, Nicosia, Pacific...),
          # Windows build logs (.tlog, .vcxproj), and other junk that a
          # GitHub Release cannot attach (HTTP 404 / invalid names).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            #dist/*.AppImage
            dist/*.deb
          #dist/*.blockmap
          #dist/*.yml
          retention-days: 30
          if-no-files-found: error

      # ── Staging Bucket Sync (Priority 1 - after S3 setup) ────────────────
      # Doc section 5.4: put artifacts into the STAGING bucket (NOT stable).
      # publish-stable.yml then promotes them from staging to stable.
      #
      # - name: Sync to staging bucket
      #   if: github.event_name == 'push'   # only on merge, not on PRs
      #   run: |
      #     aws s3 sync ./dist \
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.os }}/${{ github.sha }}/ \
      #       --metadata-directive REPLACE
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STAGING }}/${{ matrix.label }}/${{ github.sha }}/

      # ── macOS cleanup (for the notarization keychain) ────────────────────
      - name: Remove temporary keychain
        if: startsWith(matrix.label, 'macos') && always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true