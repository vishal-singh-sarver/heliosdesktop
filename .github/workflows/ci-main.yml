      #
      # TZ=Asia/Kolkata is inert: vitest.config.ts pins env TZ='UTC' internally,
      # which wins. Left in place because the suite passes either way (1299/1299
      # verified under UTC) - but do not rely on it to make an IST-hardcoded
      # test pass.
      # TEMPORARILY DISABLED - re-enable once @testing-library/dom (and any
      # other missing peers) are added to devDependencies in package.json.
      # - name: Run unit tests
