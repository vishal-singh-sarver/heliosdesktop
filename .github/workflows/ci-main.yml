      fail-fast: false
      matrix:
        include:
          # Windows - single build
          - label: windows
            os: windows-2022

          # macOS Intel (x86_64)
          - label: macos-intel
            os: macos-15-intel
            arch_suffix: "-intel"

          # macOS Apple Silicon (arm64)
          - label: macos-apple-silicon
            os: macos-15
            arch_suffix: "-apple-silicon"

          # Ubuntu 20.04 - via python:3.10-bullseye container
          # (glibc 2.31, Python 3.10 prebuilt - deadsnakes was flaky)
          - label: ubuntu20.04
            os: ubuntu-latest
            container: python:3.10-bullseye
            ubuntu_suffix: "-ubuntu20.04"

          # Ubuntu 22.04
          - label: ubuntu22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            ubuntu_suffix: "-ubuntu22.04"

          # Ubuntu 24.04 - has t64-suffixed packages, handled by the fallback below
          - label: ubuntu24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            ubuntu_suffix: "-ubuntu24.04"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
