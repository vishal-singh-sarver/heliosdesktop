name: CI / develop

# Fast gates only: lint + unit tests. No builds on develop or PRs - installers
# are built on M2 (build-installers.yml), release and main.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm 10.9.x crashes with "reading 'edgesOut'"; plain install still does on
      # 10.8.2, so fall back to --legacy-peer-deps (no lockfile in this repo).
      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow: eslint fails only on errors, so real errors fail the build.
      - name: Lint Execution
        run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      # @testing-library/react needs @testing-library/dom as a peer; the
      # --legacy-peer-deps fallback does not install peers. Remove this step once
      # it is in devDependencies.
      - name: Ensure @testing-library/dom is installed
        run: npm ls @testing-library/dom || npm install --no-save @testing-library/dom

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Run Unit Tests
        run: npm test