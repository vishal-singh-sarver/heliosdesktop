

name: CI / develop

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env
      
      # See ci-main.yml: no `|| echo` swallow. eslint fails only on errors
      # (warnings never fail it), so the previous form reported real errors as a
      # green build.
      - name: Lint Execution
        run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env
      
      # Mapped directly to your package.json "test" script ("vitest run")
      - name: Run Unit Tests
        run: npm run test

