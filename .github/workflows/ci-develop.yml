name: CI / develop

# Fast gates only: lint + unit tests. No builds on develop or PRs - installers
# are built on M2 (build-installers.yml), release and main.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: cp .env.example .env

      # No `|| echo` swallow: eslint fails only on errors (warnings never
      # fail it), so real errors correctly fail the build.
      # No `|| echo` swallow: eslint fails only on errors, so real errors fail the build.
      - name: Lint Execution
        run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: cp .env.example .env

      # Mapped directly to package.json "test" script ("vitest run")
      - name: Run Unit Tests
        run: npm test
