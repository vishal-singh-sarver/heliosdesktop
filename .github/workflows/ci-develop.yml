name: CI / develop

# Fast gates only: lint + unit tests. No builds on develop or PRs - installers
# are built on M2 (build-installers.yml), release and main.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Works around the npm/cli Arborist bug ("Cannot read properties of
      # null (reading 'edgesOut')") in newer npm 10.9.x shipped with Node 22.
      # npm 10.9.x crashes with "reading 'edgesOut'"; plain install still does on
      # 10.8.2, so fall back to --legacy-peer-deps (no lockfile in this repo).
      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      # Fallback chain: plain install, then legacy-peer-deps, then regenerate
      # the lockfile. Commit a clean package-lock.json so the last fallback
      # never triggers.
      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps
        run: |
          npm i \
            || npm i --legacy-peer-deps \
            || (rm -f package-lock.json && npm i)

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # No `|| echo` swallow: eslint fails only on errors (warnings never
      # fail it), so real errors correctly fail the build.
      # No `|| echo` swallow: eslint fails only on errors, so real errors fail the build.
      - name: Lint Execution
        run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        run: |
          npm i \
            || npm i --legacy-peer-deps \
            || (rm -f package-lock.json && npm i)
        run: npm install || npm install --legacy-peer-deps

      # @testing-library/react (v16+) needs @testing-library/dom as a peer
      # dependency. `--legacy-peer-deps` does not auto-install peers, so make
      # sure it is present. TEMPORARY: once it is added to package.json
      # devDependencies (npm install -D @testing-library/dom), this step is a
      # harmless no-op and can be removed.
      - name: Ensure @testing-library/dom is installed
        run: npm ls @testing-library/dom || npm install --no-save @testing-library/dom

      # @testing-library/react (v16+) needs @testing-library/dom as a peer
      # dependency. `--legacy-peer-deps` does not auto-install peers, so make
      # sure it is present. TEMPORARY: once it is added to package.json
      # devDependencies (npm install -D @testing-library/dom), this step is a
      # harmless no-op and can be removed.
      - name: Ensure @testing-library/dom is installed
        run: npm ls @testing-library/dom || npm install --no-save @testing-library/dom

      # @testing-library/react (v16+) needs @testing-library/dom as a peer
      # dependency. `--legacy-peer-deps` does not auto-install peers, so make
      # sure it is present. TEMPORARY: once it is added to package.json
      # devDependencies (npm install -D @testing-library/dom), this step is a
      # harmless no-op and can be removed.
      - name: Ensure @testing-library/dom is installed
        run: npm ls @testing-library/dom || npm install --no-save @testing-library/dom

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # Mapped directly to package.json "test" script ("vitest run")
      - name: Run Unit Tests
        run: npm run test

  # DISABLED: no builds on develop / PRs (builds run only on release/main/M2).
