# ============================================================================
# Back-merge main
# ============================================================================
name: Back-merge main

on:
  pull_request:
    types: [closed]
    branches: [main]

  ## Manual trigger - for emergency cases where a merge happened accidentally
  #workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. BACKMERGE-RELEASE - main -> release
  # Catch up the release branch first.
  # --------------------------------------------------------------------------
  backmerge-release:
    name: Back-merge main -> release
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'hotfix/')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history is required for the merge
          token: ${{ secrets.PAT }}

      - name: Skip if main = release already
        id: check-diff
        run: |
          set -e
          git fetch origin release main
          if git merge-base --is-ancestor origin/main origin/release; then
            echo "main is already merged into release. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has new commits that are not in release. Creating a PR."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR main -> release
        if: steps.check-diff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKMERGE_PAT }}
        run: |
          set -e

          EXISTING=$(gh pr list \
            --base release --head main \
            --state open \
            --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "PR #$EXISTING already open from main -> release. Skip."
            exit 0
          fi

          HOTFIX_BRANCH="${{ github.event.pull_request.head.ref }}"
          HOTFIX_PR="${{ github.event.pull_request.number }}"

          gh pr create \
            --base release \
            --head main \
            --title "Back-merge main -> release (auto)" \
            --body "$(cat <<EOF
          Auto-generated after hotfix merge to main.

          - **Hotfix source:** \`$HOTFIX_BRANCH\` (PR #$HOTFIX_PR)
          - **Trigger commit:** \`${GITHUB_SHA:0:7}\`
          - **Pushed by:** @${{ github.actor }}

          Review and merge this ASAP so the release branch stays in sync with
          main. If there are conflicts, resolve them manually and then merge.
          EOF
          )"

  # --------------------------------------------------------------------------
  # 2. BACKMERGE-DEVELOP - main -> develop
  # Runs after backmerge-release (needs:).
  # NOTE: let backmerge-release complete (its PR is opened) - we do NOT wait
  # for it to merge. The develop PR runs independently, in parallel.
  # --------------------------------------------------------------------------
  backmerge-develop:
    name: Back-merge main -> develop
    runs-on: ubuntu-latest
    needs: backmerge-release
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'hotfix/')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Skip if main = develop already
        id: check-diff
        run: |
          set -e
          git fetch origin develop main
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "main is already in develop. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has new commits. Creating a PR."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR main -> develop
        if: steps.check-diff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKMERGE_PAT }}
        run: |
          set -e

          EXISTING=$(gh pr list \
            --base develop --head main \
            --state open \
            --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "PR #$EXISTING already open from main -> develop. Skip."
            exit 0
          fi

          HOTFIX_BRANCH="${{ github.event.pull_request.head.ref }}"
          HOTFIX_PR="${{ github.event.pull_request.number }}"

          gh pr create \
            --base develop \
            --head main \
            --title "Back-merge main -> develop (auto)" \
            --body "$(cat <<EOF
          Auto-generated after push to main.

          - **Hotfix source:** \`$HOTFIX_BRANCH\` (PR #$HOTFIX_PR)
          - **Trigger commit:** \`${GITHUB_SHA:0:7}\`
          - **Pushed by:** @${{ github.actor }}

          Merge this PR after the release back-merge (otherwise conflicts may
          arise). This brings main's latest changes into develop as well.
          EOF
          )"