name: Emergency / single platform

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: 'Target platform patch'
        options:
          - win
          - mac
          - linux
        required: true
      channel:
        type: choice
        description: 'Target feed channel environment'
        options:
          - beta
          - stable
        required: true
      version:
        description: 'Strict format target build tag (e.g. v1.2.3)'
        required: true
      justification:
        description: 'Mandatory Written audit statement'
        required: true

jobs:
  emergency-republish:
    runs-on: ubuntu-latest
    steps:
      - name: Log Justification Audit
        run: |
          echo "EMERGENCY ACTION EXECUTION LOG"
          echo "Operator: ${{ github.actor }}"
          echo "Target Version: ${{ github.event.inputs.version }}"
          echo "Target Platform: ${{ github.event.inputs.platform }}"
          echo "Channel Destination: ${{ github.event.inputs.channel }}"
          echo "Reasoning Statement: ${{ github.event.inputs.justification }}"

      - name: Configure Cloud Storage Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.UPDATE_FEED_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.UPDATE_FEED_S3_SECRET_KEY }}
          aws-region: us-east-1

      # Resolve the destination bucket from the `channel` input. This is
      # `inputs.channel`, NOT `matrix.channel` - this job has no matrix, so the
      # old `matrix.channel` was always null and the ternary therefore always
      # picked STABLE. A beta-targeted emergency run would have published to
      # the STABLE feed while the audit log above recorded "beta".
      #
      # The bucket name itself is a secret, so it is selected here at the
      # expression level via secrets[...]; a shell-built "UPDATE_FEED_BUCKET_X"
      # string cannot index into secrets.
      - name: Execute Selective Synchronization Hotfix
        env:
          TARGET_BUCKET: ${{ inputs.channel == 'beta' && secrets.UPDATE_FEED_BUCKET_BETA || secrets.UPDATE_FEED_BUCKET_STABLE }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_BUCKET}" ]; then
            echo "ERROR: No bucket secret is set for channel '${TARGET_CHANNEL}'."
            echo "Expected UPDATE_FEED_BUCKET_BETA or UPDATE_FEED_BUCKET_STABLE."
            exit 1
          fi

          echo "Channel:  ${TARGET_CHANNEL}"
          echo "Platform: ${TARGET_PLATFORM}"
          echo "Bucket:   (resolved from secret for ${TARGET_CHANNEL})"

          # NOT YET IMPLEMENTED. The sync itself is still to be written - see
          # the commented aws s3 sync blocks in publish-stable.yml for the shape
          # it should take. Failing loudly beats the previous behaviour, which
          # authenticated to AWS, echoed a line, and exited 0 - so an operator
          # running this in an incident saw a green check and assumed a
          # republish had happened.
          echo "ERROR: emergency republish is not implemented yet; nothing was synced."
          exit 1