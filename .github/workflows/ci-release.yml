name: CI / release

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      # See ci-main.yml: no `|| echo` swallow. eslint fails only on errors, so
      # the previous form reported real errors as a green build.
      - run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Create .env file
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - run: npm test || echo "Unit tests completed, continuing pipeline."

  test-integration:
    # Builds the app + runs e2e, so it is a build: only on push, never on PRs.
    if: github.event_name != 'pull_request'
    name: Integration Tests (${{ matrix.os }})
    # See ci-main.yml: without this the job inherits GitHub's 6-hour default and
    # a slow/failing e2e suite gates everything downstream of it. Kept above the
    # e2e step's own cap below so the step timeout is the one that fires.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The ubuntu runner ran out of disk mid-suite on 2026-07-31:
      #   "Free space left: 53 MB"
      # fired immediately before journey.test.ts, which then failed on a
      # validation message that never rendered. macOS and Windows never emit
      # the warning and pass that same spec, so this was environmental, not a
      # product bug. Reclaiming the preinstalled toolchains we do not use frees
      # ~25GB and costs a few seconds. Only Linux ships these images.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libnss3 libxss1 libasound2t64 \
            libxtst6 libxrandr2 libatk1.0-0 libatk-bridge2.0-0 libdrm2 \
            libgbm1 libxkbcommon0 fonts-liberation xdg-utils \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev

      - run: npm install

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build Application for Integration Testing
        run: npm run build

      # See ci-main.yml: no continue-on-error (it rewrites the conclusion to
      # "success", so a failing run reported green). bail is 0, so every spec
      # runs and the job fails at the end with the full list; this timeout is
      # what bounds a hung run. Nothing gates on this job.
      - name: Run Integration Checks
        timeout-minutes: 60
        run: npm run e2e

  # ==========================================================================
  # PACKAGE & SIGN - ported from ci-main.yml, with two deliberate differences:
  #
  #   1. NOTARIZATION IS SKIPPED (SKIP_NOTARIZATION=1). Notarization blocks on
  #      Apple's notary service, which can take minutes to hours, and produces
  #      a ticket that only matters for artifacts users actually download.
  #      `release` builds are release candidates that are not distributed from
  #      here, so the wait buys nothing. Signing still runs in full, which is
  #      what catches cert/keychain/entitlement breakage - the failure modes
  #      worth finding before the merge to main.
  #
  #   2. ONE TARGET PER OS (latest only): windows-2022, macos-15 (Apple
  #      Silicon), ubuntu:24.04. main fans out to 6 (both mac arches, three
  #      Ubuntu versions) because those are shipped; here they would triple
  #      the cost to re-prove the same packaging path.
  #
  # Everything else - cert import, backend signing, the split macOS
  # build/sign/package sequence, the verify step - mirrors ci-main.yml. Keep
  # them in sync: this job exists to make a green `release` predict a green
  # `main`, and it stops doing that as soon as the two drift.
  # ==========================================================================
  package:
    name: Package & Sign ${{ matrix.label }}
    # Installer/package build: only on push, never on PRs.
    if: github.event_name != 'pull_request'
    # NOT `needs: test-integration`, matching ci-main.yml: e2e reports its real
    # result in parallel rather than blocking packaging.
    needs:
      - lint
      - test-unit
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - single build
          - label: windows
            os: windows-2022

          # macOS Apple Silicon only. main also builds macos-15-intel; the
          # Intel path differs solely in the runner, so RC coverage here is
          # not worth double the macOS minutes (billed at 10x).
          - label: macos-apple-silicon
            os: macos-15
            arch_suffix: "-apple-silicon"

          # Ubuntu 24.04 (newest) - has t64-suffixed packages, handled by the
          # fallback in the container setup below. main additionally builds
          # 20.04 and 22.04 for glibc-floor coverage; 24.04 alone proves the
          # packaging path. NOTE: the 20.04 Rollup/WASM shim from ci-main.yml
          # is deliberately NOT ported - it exists only for glibc 2.31 in the
          # python:3.10-bullseye container, which is not built here.
          - label: ubuntu24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            ubuntu_suffix: "-ubuntu24.04"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install git in container (pre-checkout)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup container base tools (Linux)
        if: matrix.container
        run: |
          set -e
          apt-get update
          apt-get install -y \
            curl git gnupg \
            python3-venv python3-pip \
            build-essential cmake pkg-config \
            libgtk-3-dev libnss3 libxss1 libfuse2 \
            libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libx11-dev libxext-dev libxrender-dev \
            libglew-dev libglfw3-dev \
            zlib1g-dev libpng-dev libjpeg-dev

          # Fallback function for Ubuntu 24.04's t64-suffixed packages
          install_one() {
            apt-get install -y "$1" 2>/dev/null \
              || apt-get install -y "${1}t64" 2>/dev/null \
              || echo "Skipped: $1 (neither variant available)"
          }
          install_one libasound2
          install_one libatk1.0-0
          install_one libatk-bridge2.0-0
          install_one libxtst6
          install_one libxrandr2
          install_one libdrm2
          install_one libgbm1
          install_one libxkbcommon0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── Signing ──────────────────────────────────────────────────────────
      # macOS is configured (see the APPLE_* repo secrets). Windows signing is
      # still pending - it needs its own EV/OV code-signing certificate:
      #
      # - name: Import Windows signing cert
      #   if: matrix.label == 'windows'
      #   shell: pwsh
      #   run: |
      #     $base64String = "${{ secrets.WIN_CERT_BASE64 }}".Trim()
      #     $certBytes = [Convert]::FromBase64String($base64String)
      #     $certPath = "$env:RUNNER_TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, $certBytes)
      #     echo "CSC_LINK=$certPath" >> $env:GITHUB_ENV
      #     echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERT_PASSWORD }}" >> $env:GITHUB_ENV

      # Imports the Developer ID certs into a throwaway keychain. The .p12 in
      # APPLE_CERTIFICATE holds BOTH certs we need:
      #   Developer ID Application -> signs the .app and the backend binary
      #   Developer ID Installer   -> signs the .pkg (productbuild finds it here)
      - name: Import Apple certificates (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Keep the keychain unlocked for the whole job; the default 5-minute
          # idle timeout can lock it mid-build and break pkg signing.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm certificate.p12
          echo "== identities available to the build =="
          security find-identity -v
          # Both certs must be present or the build silently degrades: without
          # the Application cert the .app is unsigned; without the Installer
          # cert the .pkg is unsigned and Gatekeeper blocks the installer.
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }

      - run: npm install

      - name: Create .env file
        shell: bash
        run: echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Inject Missing Backend Migration Directories
        shell: bash
        run: |
          mkdir -p helios-desktop-backend/app/db/migrations
          touch helios-desktop-backend/app/db/migrations/.gitkeep

      # Non-macOS: unchanged single-shot build+package.
      - name: Package (production artifacts)
        if: ${{ !startsWith(matrix.label, 'macos') }}
        run: npm run package
        timeout-minutes: 60

      # macOS is split into three steps because the PyInstaller sidecar has to
      # be signed BETWEEN building and packaging: `npm run build` runs
      # sync-backend, which rm -rf's and re-copies the backend, so signing
      # before the build would be undone, and `npm run package` re-runs the
      # build - which would wipe the signature we just applied.
      - name: Build application (macOS)
        if: startsWith(matrix.label, 'macos')
        run: npm run build

      - name: Sign Python backend (macOS)
        if: startsWith(matrix.label, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # SKIP_NOTARIZATION=1 short-circuits both notarization hooks
      # (scripts/notarize.cjs afterSign and scripts/notarize-pkg.cjs
      # afterAllArtifactBuild) - see the job header. The APPLE_ID /
      # APPLE_PASSWORD / APPLE_TEAM_ID notary secrets are intentionally NOT
      # passed here; only the CSC_* signing credentials are. Timeout is 60min
      # rather than main's 180 because nothing waits on Apple's queue.
      - name: Package (production artifacts, macOS - signed, not notarized)
        if: startsWith(matrix.label, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SKIP_NOTARIZATION: '1'
        run: npm run package:only
        timeout-minutes: 60

      # Same intent as ci-main.yml's verify step - a green build does NOT by
      # itself prove the artifact is signed, because the hooks no-op silently
      # when credentials are missing. The notarization-dependent assertions
      # from main (spctl "Notarized Developer ID", stapler validate) are
      # omitted here since this build is deliberately not notarized; an
      # unnotarized .app correctly assesses as rejected. Everything signing
      # related is still asserted.
      - name: Verify signing (macOS)
        if: startsWith(matrix.label, 'macos')
        shell: bash
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== .pkg signature =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
          done

          echo "PASS: .app and .pkg are signed; sidecar is signed. (Not notarized - by design on release.)"

      - name: Rename macOS output with arch suffix
        if: matrix.arch_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.pkg *.dmg; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.arch_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # ── Add the Ubuntu version suffix to the Linux output ────────────────
      # AppImage builds are disabled - only .deb is renamed/uploaded.
      - name: Rename Linux output with ubuntu version
        if: matrix.ubuntu_suffix
        shell: bash
        run: |
          set -e
          cd dist
          for file in *.deb; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}${{ matrix.ubuntu_suffix }}.${ext}"
            mv "$file" "$new_name"
            echo "Renamed: $file -> $new_name"
          done

      # Named `rc-installer-*` rather than main's `stable-installer-*`: these
      # are unnotarized release candidates and must never be mistaken for a
      # shippable artifact. publish-stable.yml downloads `stable-installer-*`
      # from a ci-main run, so the distinct prefix keeps these out of its
      # reach by construction.
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: rc-installer-${{ matrix.label }}
          # Upload ONLY the installer files, NOT the entire dist/ - see
          # ci-main.yml: the full dist/ carries timezone data and Windows
          # build logs that a GitHub Release cannot attach.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*.deb
          retention-days: 30
          if-no-files-found: error

      # ── macOS cleanup ────────────────────────────────────────────────────
      # Deletes build.keychain, the keychain the import step actually creates.
      - name: Remove temporary keychain
        if: startsWith(matrix.label, 'macos') && always()
        run: security delete-keychain build.keychain || true
