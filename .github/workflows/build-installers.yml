name: Build Installers

on:
  push:
    branches:
      - develop
      - M2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===============================================================================
  # WINDOWS - Produces a single .exe that runs on both Windows 10 and 11.
  # ===============================================================================
  build-windows:
    runs-on: windows-2022
    name: Build Windows Installer (10 + 11)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm 10.9.x crashes with "reading 'edgesOut'"; plain install still does on
      # 10.8.2, so fall back to --legacy-peer-deps (no lockfile in this repo).
      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        shell: bash
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        shell: bash
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      - name: Package Windows Installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            dist/*.exe
            release/*.exe
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # macOS - 2 SEPARATE FILES: Intel (x86_64) + Apple Silicon (arm64).
  # NOTE: signing is currently lenient (continue-on-error). Pkg may be unsigned
  # until the APPLE_CERTIFICATE (.p12) secret is fixed.
  # ============================================================================
  build-macos:
    name: Build macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'intel'
            runner: 'macos-15-intel'
          # - label: 'apple-silicon'
          #   runner: 'macos-15'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      # ---------------- macOS signing + notarization ----------------
      - name: Import Apple certificates
        continue-on-error: true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "WARNING: APPLE_CERTIFICATE secret is empty or missing, skipping cert import."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > certificate.p12
          ls -l certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm -f certificate.p12
          echo "== identities available to the build =="
          security find-identity -v || true

      - name: Sign Python backend
        continue-on-error: true
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '0'
        run: npm run sign:backend:mac

      - name: Package macOS Installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac:only

      - name: Tag outputs with arch
        run: |
          cd dist
          for f in *.pkg; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${base}-${{ matrix.label }}.${ext}"
          done
          ls -la

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers-${{ matrix.label }}
          path: |
            dist/*.pkg
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

