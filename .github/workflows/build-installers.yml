name: Build Installers

on:
  push:
    branches:
      # - develop   # disabled: builds restricted to release/main/M2 (no develop builds)
      - M2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================================
  # WINDOWS - Produces a single .exe that runs on both Windows 10 and 11.
  # =============================================================================
  build-windows:
    runs-on: windows-2022
    name: Build Windows Installer (10 + 11)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm ci || npm install

      - name: Create .env file
        shell: bash
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      - name: Package Windows Installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            dist/*.exe
            release/*.exe
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # macOS - 2 SEPARATE FILES: Intel (x86_64) + Apple Silicon (arm64).
  #
  # There is no separate build per macOS version (12 vs 13 vs 14...) - that is
  # by Apple's design. With minimumSystemVersion "12.0" set (in package.json),
  # both of these files run on every macOS from 12 (Monterey) to 26 (Tahoe):
  #
  #   intel file        -> all Intel Macs (macOS 12-15)
  #   apple-silicon     -> all M1/M2/M3/M4 Macs (macOS 12-26)
  #
  # NOTE: the "mac" block in package.json must contain:
  #   "mac": { "minimumSystemVersion": "12.0", "target": ["dmg","pkg"] }
  # ============================================================================
  build-macos:
    name: Build macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'intel'
            runner: 'macos-15-intel'
          - label: 'apple-silicon'
            runner: 'macos-15'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Create .env file
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      # ---------------- macOS signing + notarization ----------------
      # Imports the Developer ID certs into a throwaway keychain. The .p12 in
      # APPLE_CERTIFICATE holds BOTH certs we need:
      #   Developer ID Application -> signs the .app and the backend binary
      #   Developer ID Installer   -> signs the .pkg (productbuild finds it here)
      - name: Import Apple certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Keep the keychain unlocked for the whole job; the default 5-minute
          # idle timeout can lock it mid-notarization and break pkg signing.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm certificate.p12
          echo "== identities available to the build =="
          security find-identity -v
          # Both certs must be present or the build silently degrades: without
          # the Application cert the .app is unsigned; without the Installer
          # cert the .pkg is unsigned and Gatekeeper blocks the installer.
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }

      # The PyInstaller sidecar is copied in via extraResources and is opaque
      # to electron-builder's signing, so it must be signed separately or
      # notarization rejects the whole bundle.
      - name: Sign Python backend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
        run: npm run sign:backend:mac

      # `npm run package:mac` would re-run `npm run build`, which re-runs
      # sync-backend and overwrites the binary we just signed. Use the
      # package-only script so the signature survives.
      - name: Package macOS Installer
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac:only

      # The notarization hooks silently no-op if any APPLE_* secret is missing,
      # so a green build does NOT by itself prove the installer is notarized.
      # This step asserts it independently and fails the build otherwise -
      # otherwise the first sign of trouble is a user seeing a Gatekeeper block.
      - name: Verify signing and notarization
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          echo "== codesign --verify (.app, deep) =="
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          # find the sidecar wherever it landed (onefile or onedir layout)
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -z "$backend" ]; then
            echo "FAIL: backend binary not found inside the app bundle"
            find "$app/Contents/Resources/backend" -maxdepth 2 || true
            exit 1
          fi
          echo "backend: $backend"
          codesign --verify --strict "$backend"
          if ! codesign -dvv "$backend" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: backend binary lacks the hardened runtime"
            exit 1
          fi

          echo "== Gatekeeper assessment (.app) =="
          # "source=Notarized Developer ID" is the proof the notary ticket is
          # recognized; anything else means the ticket is missing or not stapled.
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi

          echo "== stapler validate (.app) =="
          xcrun stapler validate "$app"

          echo "== .pkg signature + notarization =="
          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          if [ -z "$pkgs" ]; then
            echo "FAIL: no .pkg artifacts found"
            exit 1
          fi
          for pkg in $pkgs; do
            echo "-- $pkg"
            # Must be signed by the Developer ID INSTALLER cert (not Application).
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            # And must carry its own stapled notarization ticket, or users get a
            # Gatekeeper block on the installer itself.
            xcrun stapler validate "$pkg"
          done

          echo "PASS: .app and .pkg are signed, notarized and stapled; sidecar is signed."

      - name: Tag outputs with arch
        run: |
          cd dist
          for f in *.pkg; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${base}-${{ matrix.label }}.${ext}"
          done
          ls -la

      - name: Upload macOS installers
        uses: actions/upload-artifact@v5
        with:
          name: macos-installers-${{ matrix.label }}
          path: |
            dist/*.pkg
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # LINUX - A SEPARATE BUILD PER VERSION (3 distinct files).
  #
  #   20.04 -> python:3.10-bullseye  (glibc 2.31, same as Ubuntu 20.04, with
  #            Python 3.10 already included. No deadsnakes/PPA needed. This file
  #            runs on 20.04, 22.04, and 24.04.)
  #   22.04 -> ubuntu:22.04          (Python 3.10 default) -> runs on 22.04 + 24.04
  #   24.04 -> ubuntu:24.04          (Python 3.12 default) -> runs on 24.04
  # ============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    name: Build Linux (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '20.04'
            image: 'python:3.10-bullseye'
          - label: '22.04'
            image: 'ubuntu:22.04'
          - label: '24.04'
            image: 'ubuntu:24.04'
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            ca-certificates \
            gnupg \
            python3 \
            python3-venv \
            python3-pip \
            build-essential

      - name: Verify Python 3.10+
        run: |
          set -e
          echo "python3 path:"; which python3
          python3 --version
          OK=$(python3 -c 'import sys; print(1 if sys.version_info >= (3,10) else 0)')
          if [ "$OK" != "1" ]; then
            echo "ERROR: Python 3.10+ required, but an older version was found. The container image is incorrect."
            exit 1
          fi

      - name: Setup Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Install Linux build dependencies
        run: |
          install_one() {
            apt-get install -y "$1" 2>/dev/null || apt-get install -y "$2" 2>/dev/null || true
          }

          apt-get install -y \
            cmake \
            pkg-config \
            git \
            libgtk-3-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            libfuse2 \
            fonts-liberation \
            xdg-utils \
            libglu1-mesa-dev \
            freeglut3-dev \
            mesa-common-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libglew-dev \
            libglfw3-dev \
            zlib1g-dev \
            libpng-dev \
            libjpeg-dev \
            fakeroot \
            dpkg \
            rpm

          install_one libasound2 libasound2t64
          install_one libatk1.0-0 libatk1.0-0t64
          install_one libatk-bridge2.0-0 libatk-bridge2.0-0t64

      - name: Install dependencies
        run: |
          npm ci || npm install

      # See ci-main.yml for the full explanation. Rollup's prebuilt
      # linux-x64-gnu addon needs GLIBC_2.32; the 20.04 job builds in
      # python:3.10-bullseye (glibc 2.31), so requiring it dies with
      # ERR_DLOPEN_FAILED. native.js requires the addon by name, so we point that
      # name at @rollup/wasm-node's dist/native.js, which exports the same
      # symbols with no libc dependency. Only this container needs it.
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == '20.04'
        run: |
          set -euo pipefail
          version=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "rollup $version - installing matching @rollup/wasm-node"
          npm install --no-save "@rollup/wasm-node@${version}"
          target=node_modules/@rollup/rollup-linux-x64-gnu
          rm -rf "$target"
          mkdir -p "$target"
          cat > "$target/package.json" <<'JSON'
          { "name": "@rollup/rollup-linux-x64-gnu", "version": "0.0.0-wasm-shim", "main": "index.js" }
          JSON
          echo "module.exports = require('@rollup/wasm-node/dist/native.js')" > "$target/index.js"
          node -e "
            const m = require('@rollup/rollup-linux-x64-gnu')
            const need = ['parse','parseAsync','xxhashBase64Url','xxhashBase36','xxhashBase16']
            const missing = need.filter(k => typeof m[k] === 'undefined')
            if (missing.length) { console.error('WASM shim missing: ' + missing.join(', ')); process.exit(1) }
            console.log('rollup native require -> WASM shim OK')
          "

      - name: Create .env file
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      - name: Package Linux Installer
        run: npm run package:linux

      # AppImage builds are disabled - only .deb is tagged/uploaded.
      - name: Tag outputs with ubuntu version
        run: |
          cd dist
          for f in *.deb; do               # AppImage disabled: was "*.deb *.AppImage"
            [ -e "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${base}-ubuntu${{ matrix.label }}.${ext}"
          done
          ls -la

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages-${{ matrix.label }}
          path: |
            #dist/*.AppImage
            dist/*.deb
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  release:
    name: Create QA Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5          # default shallow checkout; needed to read package.json

      - name: Read version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate Release Notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          echo "## Helios QA Release v${VERSION}" > notes.md
          echo "" >> notes.md
          echo "Build from the \`M2\` branch." >> notes.md
          echo "" >> notes.md
          echo "- **Version:** v${VERSION}" >> notes.md
          echo "- **Commit:** \`${SHORT_SHA}\`" >> notes.md
          echo "- **Built:** ${DATE}" >> notes.md
          echo "" >> notes.md
          echo "| OS | File | Size | SHA256 |" >> notes.md
          echo "|----|------|------|--------|" >> notes.md

          find artifacts -type f | while read file; do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            checksum=$(sha256sum "$file" | awk '{print $1}')
            url="https://github.com/$REPO/releases/download/QA-Release/$name"

            os="Unknown"
            [[ "$name" == *.exe ]] && os="Windows"
            [[ "$name" == *.dmg ]] && os="macOS"
            [[ "$name" == *.pkg ]] && os="macOS"
            [[ "$name" == *.AppImage ]] && os="Linux"
            [[ "$name" == *.deb ]] && os="Linux"

            echo "| $os | [$name]($url) | $size | \`$checksum\` |" >> notes.md
          done

          cat notes.md

      - name: Delete previous QA-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete QA-Release \
            --yes \
            --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - name: Create QA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: QA-Release
          name: "Helios QA Release v${{ steps.version.outputs.version }}"
          body_path: notes.md
          files: artifacts/**/*
          draft: false
          prerelease: true
          make_latest: false
