name: Build Installers

on:
  push:
    branches:
      - develop
      - M2
      - feature/bugfixesp3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================================
  # WINDOWS - ek hi .exe banta hai jo Windows 10 AUR 11 dono par chalta hai.
  # =============================================================================
  build-windows:
    runs-on: windows-2022
    name: Build Windows Installer (10 + 11)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm ci || npm install

      - name: Create .env file
        shell: bash
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      - name: Package Windows Installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            release/*.exe
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # macOS - 2 ALAG FILES: Intel (x86_64) + Apple Silicon (arm64).
  #
  # Per-OS-version (12 vs 13 vs 14...) alag build banti hi nahi - Apple ka
  # design hai. minimumSystemVersion "12.0" set hai (package.json mein), to
  # YE DONO files macOS 12 (Monterey) se 26 (Tahoe) tak SAB par chalti hain:
  #
  #   intel file        -> sab Intel Macs (macOS 12-15)
  #   apple-silicon     -> sab M1/M2/M3/M4 Macs (macOS 12-26)
  #
  # NOTE: package.json ke "mac" block mein zaroori hai:
  #   "mac": { "minimumSystemVersion": "12.0", "target": ["dmg","pkg"] }
  # ============================================================================
  build-macos:
    name: Build macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'intel'
            runner: 'macos-15-intel'
          - label: 'apple-silicon'
            runner: 'macos-15'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      # ---------------- macOS signing + notarization ----------------
      - name: Import Apple certificates
        continue-on-error: true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "WARNING: APPLE_CERTIFICATE secret is empty or missing, skipping cert import."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > certificate.p12
          ls -l certificate.p12
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "WARNING: APPLE_CERTIFICATE secret is empty or missing, skipping cert import."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > certificate.p12
          ls -l certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k actions build.keychain
          rm -f certificate.p12
          echo "== identities available to the build =="
          security find-identity -v || true
          security find-identity -v
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "FAIL: no Developer ID Application identity imported"; exit 1; }
          security find-identity -v | grep -q "Developer ID Installer" \
            || { echo "FAIL: no Developer ID Installer identity imported"; exit 1; }
          security find-identity -v || true

      - name: Sign Python backend
        continue-on-error: true
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '0'
        run: npm run sign:backend:mac || true
        run: npm run sign:backend:mac
          REQUIRE_SIGNING: '0'
        run: npm run sign:backend:mac || true

      - name: Package macOS Installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac:only

      - name: Verify signing and notarization
        continue-on-error: true
        run: |
          set -euo pipefail

          app="dist/mac/Helios.app"
          [ -d "$app" ] || app=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "FAIL: no .app found under dist/"
            find dist -maxdepth 3 -name '*.app' -o -maxdepth 2 -name '*.pkg' || true
            exit 1
          fi
          echo "Verifying app: $app"

          codesign --verify --deep --strict --verbose=2 "$app" || true
          codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
          codesign -dvv "$app" 2>&1 | grep -i "flags" || true

          echo "== signing authority (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "FAIL: .app is not signed with a Developer ID Application certificate"
            codesign -dvv "$app" 2>&1 | grep -i "authority\|signature" || true
            exit 1
          fi

          echo "== hardened runtime (.app) =="
          if ! codesign -dvv "$app" 2>&1 | grep -q "flags=.*runtime"; then
            echo "FAIL: .app was not signed with the hardened runtime"
            exit 1
          fi

          echo "== the bundled backend must carry its own signature =="
          backend=$(find "$app/Contents/Resources/backend" -type f -name 'heliosgui_backend' | head -1)
          if [ -n "$backend" ]; then
            echo "backend: $backend"
            codesign --verify --strict "$backend" || true
          fi

          spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
          xcrun stapler validate "$app" || true
          echo "== Gatekeeper assessment (.app) =="
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assess"
          if ! echo "$assess" | grep -q "source=Notarized Developer ID"; then
            echo "FAIL: .app did not assess as Notarized Developer ID"
            exit 1
          fi
          spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
          xcrun stapler validate "$app" || true

          pkgs=$(find dist -maxdepth 1 -name '*.pkg' | sort)
          for pkg in $pkgs; do
            echo "-- $pkg"
            pkgutil --check-signature "$pkg" 2>&1 || true
            xcrun stapler validate "$pkg" || true
            # Must be signed by the Developer ID INSTALLER cert (not Application).
            sig=$(pkgutil --check-signature "$pkg" 2>&1)
            echo "$sig"
            if ! echo "$sig" | grep -q "Developer ID Installer"; then
              echo "FAIL: $pkg is not signed with a Developer ID Installer certificate"
              exit 1
            fi
            xcrun stapler validate "$pkg"
            pkgutil --check-signature "$pkg" 2>&1 || true
            xcrun stapler validate "$pkg" || true
          done

      - name: Tag outputs with arch
        run: |
          cd dist
          for f in *.pkg; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${base}-${{ matrix.label }}.${ext}"
          done
          ls -la

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers-${{ matrix.label }}
          path: |
            dist/*.pkg
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # LINUX - HAR VERSION KI ALAG BUILD (3 alag files).
  #
  #   20.04 -> python:3.10-bullseye  (glibc 2.31 = ubuntu 20.04 jaisa, +Python
  #            3.10 pehle se. KOI deadsnakes/PPA nahi. Ye file 20.04, 22.04,
  #            24.04 SAB par chalti hai.)
  #   22.04 -> ubuntu:22.04          (Python 3.10 default) -> 22.04 + 24.04
  #   24.04 -> ubuntu:24.04          (Python 3.12 default) -> 24.04
  # ============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    name: Build Linux (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '20.04'
            image: 'python:3.10-bullseye'
          - label: '22.04'
            image: 'ubuntu:22.04'
          - label: '24.04'
            image: 'ubuntu:24.04'
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      # Debian 11 (bullseye) is EOL: point apt at archive.debian.org and drop
      # the security/updates suites (they are no longer served there).
      - name: Fix archived Debian bullseye repos (20.04 image only)
        if: matrix.label == '20.04'
        run: |
          sed -i \
            -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' \
            /etc/apt/sources.list
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          sed -i '/bullseye-updates/d' /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources || true
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid

      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            ca-certificates \
            gnupg \
            build-essential

      # Ubuntu images only. python3-dev provides libpython3.x.so, which
      # PyInstaller needs ("Python shared library not found" otherwise).
      # The 20.04 job uses the python:3.10 image, which already has Python.
      - name: Install Python (Ubuntu images)
        if: matrix.label != '20.04'
        run: |
          apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            python3-dev

      - name: Verify Python 3.10+
        run: |
          set -e
          echo "python3 path:"; which python3
          python3 --version
          OK=$(python3 -c 'import sys; print(1 if sys.version_info >= (3,10) else 0)')
          if [ "$OK" != "1" ]; then
            echo "ERROR: Python 3.10+ required."
            echo "ERROR: Python 3.10+ required."
            echo "ERROR: Python 3.10+ required, but an older version was found. The container image is incorrect."
            echo "ERROR: Python 3.10+ required."
            exit 1
          fi

      - name: Setup Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Pin known-good npm version
        run: npm install -g npm@10.8.2

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - name: Install Linux build dependencies
        run: |
          install_one() {
            apt-get install -y "$1" 2>/dev/null || apt-get install -y "$2" 2>/dev/null || true
          }

          apt-get install -y \
            cmake \
            pkg-config \
            git \
            libgtk-3-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            libfuse2 \
            fonts-liberation \
            xdg-utils \
            libglu1-mesa-dev \
            freeglut3-dev \
            mesa-common-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libglew-dev \
            libglfw3-dev \
            zlib1g-dev \
            libpng-dev \
            libjpeg-dev \
            fakeroot \
            dpkg \
            rpm

          install_one libasound2 libasound2t64
          install_one libatk1.0-0 libatk1.0-0t64
          install_one libatk-bridge2.0-0 libatk-bridge2.0-0t64

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      # Rollup's prebuilt linux-x64-gnu addon needs GLIBC_2.32, but the 20.04
      # job runs in glibc 2.31. Replace it with the WASM build. Skipped when
      # rollup is not installed (Vite 8 uses rolldown, which loads fine) or its
      # native addon already loads.
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == '20.04'
        run: |
          echo "== rollup / rolldown packages =="
          find node_modules -maxdepth 6 -type d \( -name rollup -o -name rolldown -o -name 'rollup-linux-x64-gnu' -o -name 'binding-linux-x64-gnu' \) | head -20 || true

          pkg=$(find node_modules -maxdepth 6 -type f -path '*node_modules/rollup/package.json' | head -1 || true)
          if [ -z "$pkg" ]; then
            echo "rollup not installed - skipping WASM shim"
            exit 0
          fi

          version=$(node -p "require('./$pkg').version")
          echo "rollup $version - installing matching @rollup/wasm-node"
      # See ci-main.yml for the full explanation. Rollup's prebuilt
      # linux-x64-gnu addon needs GLIBC_2.32; the 20.04 job builds in
      # python:3.10-bullseye (glibc 2.31), so requiring it dies with
      # ERR_DLOPEN_FAILED. native.js requires the addon by name, so we point that
      # name at @rollup/wasm-node's dist/native.js, which exports the same
      # symbols with no libc dependency. Only this container needs it.
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == '20.04'
        run: |
      - name: Use Rollup WASM build (glibc 2.31 container)
        if: matrix.label == '20.04'
        run: |
          set -eu
          if [ ! -f node_modules/rollup/package.json ]; then
            echo "rollup not installed (Vite 8 uses rolldown) - no WASM shim needed."
            exit 0
          fi
          if node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null; then
            echo "rollup native addon loads - no WASM shim needed."
            exit 0
          fi
          version=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "== rollup / rolldown packages =="
          find node_modules -maxdepth 6 -type d \( -name rollup -o -name rolldown -o -name 'rollup-linux-x64-gnu' -o -name 'binding-linux-x64-gnu' \) | head -20 || true

          pkg=$(find node_modules -maxdepth 6 -type f -path '*node_modules/rollup/package.json' | head -1 || true)
          if [ -z "$pkg" ]; then
            echo "rollup not installed - skipping WASM shim"
            exit 0
          fi

          version=$(node -p "require('./$pkg').version")
          echo "rollup $version - installing matching @rollup/wasm-node"
          npm install --no-save "@rollup/wasm-node@${version}"
          target=node_modules/@rollup/rollup-linux-x64-gnu
          rm -rf "$target"
          mkdir -p "$target"
          echo '{ "name": "@rollup/rollup-linux-x64-gnu", "version": "0.0.0-wasm-shim", "main": "index.js" }' > "$target/package.json"
          echo "module.exports = require('@rollup/wasm-node/dist/native.js')" > "$target/index.js"
          node -e "require('@rollup/rollup-linux-x64-gnu').parse || process.exit(1)" && echo "WASM shim OK"
          node -e "require('@rollup/rollup-linux-x64-gnu').parse || process.exit(1)" && echo "WASM shim OK"
          node -e "
            const m = require('@rollup/rollup-linux-x64-gnu')
            const need = ['parse','parseAsync','xxhashBase64Url','xxhashBase36','xxhashBase16']
            const missing = need.filter(k => typeof m[k] === 'undefined')
            if (missing.length) { console.error('WASM shim missing: ' + missing.join(', ')); process.exit(1) }
            console.log('rollup native require -> WASM shim OK')
          "

      - name: Create .env file
        run: |
          echo "VITE_BACKEND_URL=http://localhost:8000" > .env

      - name: Build application
        run: npm run build

      - name: Package Linux Installer
        run: npm run package:linux

      # AppImage builds are disabled - only .deb is tagged/uploaded.
      - name: Tag outputs with ubuntu version
        run: |
          cd dist
          for f in *.deb; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${base}-ubuntu${{ matrix.label }}.${ext}"
          done
          ls -la

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages-${{ matrix.label }}
          path: |
            dist/*.deb
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # DOCS - Builds the MkDocs technical documentation site (docs/) per the
  # README's "Documentation site" steps. This is a plain checkout (no
  # --recurse-submodules needed): the docs site needs Python 3.9+ and Git,
  # plus Node/npm only to invoke the npm run docs:* shortcuts, which call
  # .venv-docs/bin/mkdocs directly - no `npm install` / node_modules required.
  #
  #   1. Install: python -m venv .venv-docs + pip install -r docs/requirements.txt
  #   2. Check the build: npm run docs:build (mkdocs build --strict - fails on
  #      any warning, e.g. a broken link or a page missing from mkdocs.yml nav)
  #   3. Build the offline copy: npm run docs:offline -> helios-docs.zip
  #      (sets HELIOS_DOCS_OFFLINE=true so Mermaid/fonts/search are vendored)
  #
  # Note: docs/dev/api/endpoints.md and docs/reference/catalog.md are
  # generated by docs/gen/generate_reference.py and already committed, so this
  # job does NOT run `npm run docs:generate` - that needs the backend venv +
  # native PyHelios build, which this lightweight job intentionally skips.
  # ============================================================================
  build-docs:
    runs-on: ubuntu-latest
    name: Build Documentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install docs dependencies
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -r docs/requirements.txt

      # Speeds up repeat runs: the offline build's Material privacy/offline
      # plugins download Mermaid + Inter/JetBrains Mono fonts + the search
      # polyfill into .cache/plugin/privacy/ on first use (see README). A CI
      # runner starts clean every time, so without this cache that download
      # repeats on every run instead of only after docs/requirements.txt changes.
      - name: Cache docs offline assets
        uses: actions/cache@v4
        with:
          path: .cache/plugin/privacy
          key: docs-offline-cache-${{ hashFiles('docs/requirements.txt', 'mkdocs.yml') }}
          restore-keys: |
            docs-offline-cache-

      - name: Check docs build (strict)
        run: npm run docs:build

      - name: Build offline docs copy
        run: npm run docs:offline

      # continue-on-error: the repo's Actions storage quota can be exhausted
      # independent of this job (see other jobs' artifacts), which fails
      # CreateArtifact with "storage quota has been hit" - that's a
      # billing/storage issue, not a docs problem. Don't let it redden this
      # job or block anything that depends on it.
      - name: Upload offline docs archive
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: docs-offline
          path: helios-docs.zip
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  release:
    name: Create QA Release
    # Unchanged from the original pipeline: release only gates on the
    # installer builds. build-docs runs alongside but never blocks it.
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        shell: bash
        run: |
          set -e

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          echo "## Helios QA Release" > notes.md
          echo "" >> notes.md
          echo "Latest build from \`develop/M2\` branch." >> notes.md
          echo "" >> notes.md
          echo "- **Commit:** \`${SHORT_SHA}\`" >> notes.md
          echo "- **Built:** ${DATE}" >> notes.md
          echo "" >> notes.md
          echo "| OS | File | Size | SHA256 |" >> notes.md
          echo "|----|------|------|--------|" >> notes.md

          find artifacts -type f | while read file; do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            checksum=$(sha256sum "$file" | awk '{print $1}')
            url="https://github.com/$REPO/releases/download/QA-Release-Desktop/$name"

            os="Unknown"
            [[ "$name" == *.exe ]] && os="Windows"
            [[ "$name" == *.dmg ]] && os="macOS"
            [[ "$name" == *.pkg ]] && os="macOS"
            [[ "$name" == *.AppImage ]] && os="Linux"
            [[ "$name" == *.deb ]] && os="Linux"
            [[ "$name" == *.zip ]] && os="Docs"

            echo "| $os | [$name]($url) | $size | \`$checksum\` |" >> notes.md
          done

          cat notes.md

      - name: Delete previous QA-Release-Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete QA-Release-Desktop \
            --yes \
            --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - name: Create QA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: QA-Release-Desktop
          name: "Helios QA Release Desktop(latest develop/M2)"
          body_path: notes.md
          files: artifacts/**/*
          draft: false
          prerelease: true
          make_latest: false