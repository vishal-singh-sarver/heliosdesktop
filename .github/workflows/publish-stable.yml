# ============================================================================
# Publish / stable
#
# Tag-triggered: pushing a v1.2.3-style tag on main runs this workflow.
# A tag is an immutable record of "what shipped". We deliberately do not use a
# manual button because a button leaves no audit trail. (Doc section 5.5)
#
# 3 jobs:
#   1. verify      - is the tag on main? are the artifacts available?
#   2. promote     - per-platform (matrix) - copy from staging to the stable bucket
#   3. github-release - create the GitHub Release + Slack notify
#                     (if: always() - runs even if one platform fails)
#
# Doc reference: section 5.5
# ============================================================================
name: Publish / stable

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write     # to create the GitHub Release
  actions: read       # to download ci-main artifacts

jobs:
  # --------------------------------------------------------------------------
  # 1. VERIFY - is the tag valid? is it on main? are the artifacts available?
  # --------------------------------------------------------------------------
  verify:
    name: Verify Tag & Artifacts
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.find-run.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history is required for tag verification

      - name: Verify tag is on main branch
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Checking tag: $TAG"

          # Get the tag's commit
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Tag commit SHA: $TAG_SHA"

          # Verify this commit is on the main branch
          git fetch origin main
          if ! git branch -r --contains "$TAG_SHA" | grep -q 'origin/main'; then
            echo "ERROR: The commit for tag $TAG is not on the main branch. Aborting."
            exit 1
          fi
          echo "OK: The tag is on main."

      - name: Find ci-main run for this commit
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_SHA=$(git rev-list -n 1 "${GITHUB_REF#refs/tags/}")
          echo "Looking for ci-main.yml run on commit $TAG_SHA..."

          # Use the gh CLI to find the latest ci-main run for this commit
          RUN_ID=$(gh run list \
            --workflow=ci-main.yml \
            --commit="$TAG_SHA" \
            --status=completed \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")] | .[0].databaseId' \
            || true)

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful ci-main run was found for this commit."
            echo "First push to main, let ci-main pass, then create the tag."
            exit 1
          fi
          echo "Found ci-main run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 2. PROMOTE - copy each platform's artifacts from staging to stable
  # fail-fast: false - if one platform fails, the others still run
  # --------------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows
          - macos-intel
          - macos-apple-silicon
          - ubuntu20.04
          - ubuntu22.04
          - ubuntu24.04
    runs-on: ubuntu-latest
    steps:
      - name: Download ci-main artifacts (this platform only)
        uses: actions/download-artifact@v5
        with:
          name: stable-installer-${{ matrix.platform }}
          path: ./dist
          run-id: ${{ needs.verify.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files
        run: ls -la ./dist

      # ── Stable Bucket Sync (Priority 1 - uncomment after S3 setup) ───────
      # See doc section 5.5 + section 8.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.UPDATE_FEED_S3_ACCESS_KEY }}
      #     aws-secret-access-key: ${{ secrets.UPDATE_FEED_S3_SECRET_KEY }}
      #     aws-region: us-east-1
      #
      # - name: Promote to stable bucket
      #   run: |
      #     aws s3 sync ./dist \
      #       s3://${{ secrets.UPDATE_FEED_BUCKET_STABLE }}/ \
      #       --metadata-directive REPLACE \
      #       --cache-control "max-age=300"

      - name: Re-upload artifacts (combined for github-release job)
        uses: actions/upload-artifact@v5
        with:
          name: stable-release-${{ matrix.platform }}
          path: ./dist
          retention-days: 90

  # --------------------------------------------------------------------------
  # 3. GITHUB-RELEASE - create the GitHub Release + Slack notify
  # if: always() - create the release even if one platform fails
  # --------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release & Notify
    needs: [verify, promote]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all stable artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: stable-release-*

      - name: Generate Release Notes
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          echo "## Helios ${TAG} - Stable Release" > notes.md
          echo "" >> notes.md
          echo "- **Released:** ${DATE}" >> notes.md
          echo "- **Commit:** \`${GITHUB_SHA:0:7}\`" >> notes.md
          echo "" >> notes.md

          # Per-platform promotion status table
          echo "### Platform Status" >> notes.md
          echo "" >> notes.md
          echo "| Platform | Status |" >> notes.md
          echo "|----------|--------|" >> notes.md
          # NOTE: reading the matrix job results dynamically here is complex, so
          # this is a placeholder for now. In the future we can use the
          # workflow_run API to surface detailed status.
          echo "| Windows  | See workflow run for details |" >> notes.md
          echo "| macOS    | See workflow run for details |" >> notes.md
          echo "| Linux    | See workflow run for details |" >> notes.md
          echo "" >> notes.md

          echo "### Assets" >> notes.md
          echo "" >> notes.md
          echo "| OS | File | Size | SHA256 |" >> notes.md
          echo "|----|------|------|--------|" >> notes.md

          find artifacts -type f | while read file; do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            checksum=$(sha256sum "$file" | awk '{print $1}')
            url="https://github.com/$REPO/releases/download/$TAG/$name"

            os="Unknown"
            [[ "$name" == *.exe ]] && os="Windows"
            [[ "$name" == *.dmg ]] && os="macOS"
            [[ "$name" == *.pkg ]] && os="macOS"
            [[ "$name" == *.AppImage ]] && os="Linux"
            [[ "$name" == *.deb ]] && os="Linux"

            echo "| $os | [$name]($url) | $size | \`$checksum\` |" >> notes.md
          done

          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Helios ${{ github.ref_name }}"
          body_path: notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
          make_latest: true

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 Helios ${{ github.ref_name }} STABLE released!\nVerify: ${{ needs.verify.result }}\nPromote: ${{ needs.promote.result }}\n<https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_RELEASES }}